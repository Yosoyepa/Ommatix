<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 618" width="360" height="618" role="img" aria-labelledby="title desc"><title id="title">Fail-closed action gate</title><desc id="desc">A request with valid arguments and a new request_id reaches the reference check: snapshot, target, revision and age. A repeated request_id returns its stored result instead. A dry run, the default, then returns simulated. Live input must also pass the operator&#x27;s policy, the allowed foreground application, a comparison of a new capture with the committed base, and a last look. A failed check is rejected and nothing is delivered. A delivery reports input_delivered; a verified visual change reports effect_observed, and an effect that cannot be confirmed reports indeterminate.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style><rect x="0.5" y="0.5" width="359" height="617" rx="10" fill="#151b23" stroke="#3d444d"/><text x="20" y="38" font-size="19" fill="#f0f6fc" font-weight="700">Fail-closed action gate</text><rect x="20" y="54" width="320" height="48" rx="8" fill="#0d1117" stroke="#5a4fa8"/><g transform="translate(32 66)"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9-1.9 5.6-1.9-5.6-5.6-1.9 5.6-1.9z" fill="#231f45" stroke="#b3a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 16.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="#b3a6ff" stroke="#b3a6ff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="74" font-size="15" fill="#f0f6fc" font-weight="600">Request</text><text x="66" y="92" font-size="13" fill="#9198a1">valid arguments · new request_id</text><path d="M38 104L38 116M34 112L38 116L42 112" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="120" width="320" height="48" rx="8" fill="#0d1117" stroke="#1f7a70"/><g transform="translate(32 132)"><path d="M3.5 4.5h8.2l8.8 8.8-7.2 7.2-9.8-9.8z" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.6" fill="#4fd1bd"/></g><text x="66" y="140" font-size="15" fill="#f0f6fc" font-weight="600">Reference</text><text x="66" y="158" font-size="13" fill="#9198a1">snapshot · target · revision · age</text><path d="M38 170L38 184M34 180L38 184L42 180" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="58" y="176" width="85" height="22" rx="4" fill="#0f2e2c" stroke="#1f7a70"/><text x="100.5" y="191.5" font-size="13" fill="#4fd1bd" font-weight="600" text-anchor="middle" class="m">simulated</text><text x="151" y="191.5" font-size="13" fill="#4fd1bd" font-weight="600">dry run · default</text><text x="20" y="222" font-size="13" fill="#e3b341" font-weight="600">live · dry_run: false</text><path d="M38 252V482" fill="none" stroke="#3d444d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="38" cy="252" r="16" fill="#0d1117" stroke="#3d444d"/><g transform="translate(27 241) scale(0.92)"><path d="M12 2.5l8 3v6.2c0 5-3.4 8.3-8 9.8-4.6-1.5-8-4.8-8-9.8V5.5z" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.4 12.2l2.6 2.6 4.8-5.2" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="249" font-size="15" fill="#f0f6fc" font-weight="600">Policy</text><text x="66" y="266" font-size="13" fill="#9198a1">operator allows</text><circle cx="38" cy="298" r="16" fill="#0d1117" stroke="#3d444d"/><g transform="translate(27 287) scale(0.92)"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5"/><path d="M2.5 9h19" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="295" font-size="15" fill="#f0f6fc" font-weight="600">Foreground</text><text x="66" y="312" font-size="13" fill="#9198a1">allowed app</text><circle cx="38" cy="344" r="16" fill="#0d1117" stroke="#3d444d"/><g transform="translate(27 333) scale(0.92)"><circle cx="12" cy="12" r="9" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5"/><path d="M12 7v5.2l3.4 2" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="341" font-size="15" fill="#f0f6fc" font-weight="600">Freshness</text><text x="66" y="358" font-size="13" fill="#9198a1">new capture</text><circle cx="38" cy="390" r="16" fill="#0d1117" stroke="#3d444d"/><g transform="translate(27 379) scale(0.92)"><path d="M19.8 12a7.8 7.8 0 1 1-2.6-5.8M19.8 3.6v4.6h-4.6" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.2" fill="#4fd1bd"/></g><text x="66" y="387" font-size="15" fill="#f0f6fc" font-weight="600">Last look</text><text x="66" y="404" font-size="13" fill="#9198a1">checked again</text><circle cx="38" cy="436" r="16" fill="#0d1117" stroke="#1f7a70"/><g transform="translate(27 425) scale(0.92)"><path d="M6 3.5l12.5 8.2-5.4 1.1 3.3 6.4-2.4 1.2-3.2-6.4-4.1 3.6z" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="433" font-size="15" fill="#f0f6fc" font-weight="600">Deliver</text><text x="66" y="450" font-size="13" fill="#9198a1">authorised input</text><circle cx="38" cy="482" r="16" fill="#0d1117" stroke="#1f7a70"/><g transform="translate(27 471) scale(0.92)"><path d="M2 12c2.6-4.4 6-6.5 10-6.5s7.4 2.1 10 6.5c-2.6 4.4-6 6.5-10 6.5S4.6 16.4 2 12z" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="#4fd1bd"/></g><text x="66" y="479" font-size="15" fill="#f0f6fc" font-weight="600">Verify</text><text x="66" y="496" font-size="13" fill="#9198a1">visual change</text><path d="M20 512h320" fill="none" stroke="#3d444d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="524" width="73" height="22" rx="4" fill="#32270a" stroke="#7d6220"/><text x="56.5" y="539.5" font-size="12" fill="#e3b341" font-weight="600" text-anchor="middle" class="m">rejected</text><text x="101" y="539.5" font-size="13" fill="#9198a1">nothing delivered</text><rect x="20" y="554" width="124" height="22" rx="4" fill="#0f2e2c" stroke="#1f7a70"/><text x="82" y="569.5" font-size="12" fill="#4fd1bd" font-weight="600" text-anchor="middle" class="m">input_delivered</text><rect x="150" y="554" width="124" height="22" rx="4" fill="#0f2e2c" stroke="#1f7a70"/><text x="212" y="569.5" font-size="12" fill="#4fd1bd" font-weight="600" text-anchor="middle" class="m">effect_observed</text><rect x="20" y="582" width="109" height="22" rx="4" fill="#32270a" stroke="#7d6220"/><text x="74.5" y="597.5" font-size="12" fill="#e3b341" font-weight="600" text-anchor="middle" class="m">indeterminate</text></svg>
