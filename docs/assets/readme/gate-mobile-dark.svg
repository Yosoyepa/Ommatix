<svg xmlns="http://www.w3.org/2000/svg" width="600" height="488" aria-labelledby="title desc" role="img" viewBox="0 0 600 488"><title id="title">Fail-closed action gate</title><desc id="desc">Default dry run is simulated. Live input requires local policy, foreground attestation, a fresh snapshot and last look before delivery. The result reports delivery and effect separately.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}</style><rect width="600" height="488" fill="#0d1b2a" stroke="#3c5369" rx="24"/><text x="32" y="48" fill="#f0f6fc" font-size="22" font-weight="700">LIVE INPUT REQUIRES EVERY CHECK</text><rect width="256" height="88" x="32" y="88" fill="#142b3f" stroke="#3c5369" rx="12"/><text x="48" y="122" fill="#f0f6fc" font-size="23" font-weight="650">Dry run?</text><text x="48" y="153" fill="#adbdce" font-size="17">yes → simulated</text><rect width="256" height="88" x="312" y="88" fill="#142b3f" stroke="#3c5369" rx="12"/><text x="328" y="122" fill="#f0f6fc" font-size="23" font-weight="650">Policy</text><text x="328" y="153" fill="#adbdce" font-size="17">operator permits</text><rect width="256" height="88" x="32" y="200" fill="#142b3f" stroke="#3c5369" rx="12"/><text x="48" y="234" fill="#f0f6fc" font-size="23" font-weight="650">Foreground</text><text x="48" y="265" fill="#adbdce" font-size="17">allowlist + scope</text><rect width="256" height="88" x="312" y="200" fill="#142b3f" stroke="#3c5369" rx="12"/><text x="328" y="234" fill="#f0f6fc" font-size="23" font-weight="650">Freshness</text><text x="328" y="265" fill="#adbdce" font-size="17">snapshot + last look</text><rect width="256" height="88" x="32" y="312" fill="#142b3f" stroke="#3c5369" rx="12"/><text x="48" y="346" fill="#f0f6fc" font-size="23" font-weight="650">Deliver</text><text x="48" y="377" fill="#adbdce" font-size="17">then verify</text><text x="32" y="464" fill="#68e1ce" font-size="16">Any failed check refuses input. Uncertainty never triggers an automatic retry.</text></svg>
