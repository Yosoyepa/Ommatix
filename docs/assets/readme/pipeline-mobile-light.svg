<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 756" width="360" height="756" role="img" aria-labelledby="title desc"><title id="title">Ommatix observation and action pipeline</title><desc id="desc">Eleven numbered stages. The engine captures a frame, plans the changed regions, runs the detector and OCR on them, fuses the evidence, resolves icons, tracks identity and publishes an atomic snapshot. The LLM agent reasons over MCP. The engine then gates the action, delivers authorised input and verifies the effect. Every delivery spends the snapshot.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style><rect x="0.5" y="0.5" width="359" height="755" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="20" y="38" font-size="19" fill="#1f2328" font-weight="700">From a frame to an</text><text x="20" y="62" font-size="19" fill="#1f2328" font-weight="700">accountable action</text><text x="20" y="84" font-size="13" fill="#59636e">Perception stays local.</text><text x="20" y="101" font-size="13" fill="#59636e">Reasoning stays with the agent.</text><circle cx="24" cy="120.5" r="4" fill="#0a6b62"/><text x="34" y="125" font-size="13" fill="#59636e">Ommatix engine</text><circle cx="152.43" cy="120.5" r="4" fill="#5a45c4"/><text x="162.43" y="125" font-size="13" fill="#59636e">Agent (MCP client)</text><path d="M38 162V662" fill="none" stroke="#d1d9e0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="38" cy="162" r="17" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(26 150)"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5"/><path d="M2.5 9h19" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="159" font-size="13" fill="#0a6b62" font-weight="700" class="m">01</text><text x="92" y="159" font-size="15" fill="#1f2328" font-weight="600">Capture</text><text x="68" y="177" font-size="13" fill="#59636e">frame + dirty rectangles</text><circle cx="38" cy="212" r="17" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(26 200)"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="#0a6b62" stroke-width="1.5"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18" fill="none" stroke="#0a6b62" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="9" y="9" width="6" height="6" fill="#0a6b62"/><rect x="15" y="9" width="6" height="6" fill="#0a6b62"/></g><text x="68" y="209" font-size="13" fill="#0a6b62" font-weight="700" class="m">02</text><text x="92" y="209" font-size="15" fill="#1f2328" font-weight="600">Region plan</text><text x="68" y="227" font-size="13" fill="#59636e">committed base + halo</text><circle cx="38" cy="262" r="17" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(26 250)"><rect x="2.5" y="5.5" width="19" height="13" rx="2" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-dasharray="3 2.5"/><path d="M7 15l2.5-6 2.5 6M8 13.2h3M14.5 12.3a1.8 1.8 0 1 0 0 2.4M16.3 10.6v4.4" fill="none" stroke="#0a6b62" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="259" font-size="13" fill="#0a6b62" font-weight="700" class="m">03</text><text x="92" y="259" font-size="15" fill="#1f2328" font-weight="600">Detector + OCR</text><text x="68" y="277" font-size="13" fill="#59636e">planned regions only</text><circle cx="38" cy="312" r="17" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(26 300)"><rect x="3" y="4" width="12" height="11" rx="2" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5"/><rect x="9" y="9" width="12" height="11" rx="2" fill="none" stroke="#0a6b62" stroke-width="1.5"/></g><text x="68" y="309" font-size="13" fill="#0a6b62" font-weight="700" class="m">04</text><text x="92" y="309" font-size="15" fill="#1f2328" font-weight="600">Spatial fusion</text><text x="68" y="327" font-size="13" fill="#59636e">visual + optional UIA</text><circle cx="38" cy="362" r="17" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(26 350)"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" fill="none" stroke="#0a6b62" stroke-width="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5" fill="none" stroke="#0a6b62" stroke-width="1.5"/><path d="M15.2 15.6a2.2 2.2 0 1 1 3 2.1c-.7.4-.9.8-.9 1.4M17.3 21v.1" fill="none" stroke="#0a6b62" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="359" font-size="13" fill="#0a6b62" font-weight="700" class="m">05</text><text x="92" y="359" font-size="15" fill="#1f2328" font-weight="600">Icon cache</text><text x="68" y="377" font-size="13" fill="#59636e">curated; may abstain</text><circle cx="38" cy="412" r="17" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(26 400)"><path d="M3.5 4.5h8.2l8.8 8.8-7.2 7.2-9.8-9.8z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.6" fill="#0a6b62"/></g><text x="68" y="409" font-size="13" fill="#0a6b62" font-weight="700" class="m">06</text><text x="92" y="409" font-size="15" fill="#1f2328" font-weight="600">Identity</text><text x="68" y="427" font-size="13" fill="#59636e">session IDs + revisions</text><circle cx="38" cy="462" r="17" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(26 450)"><path d="M12 3.5l9 4.5-9 4.5-9-4.5z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12.5l9 4.5 9-4.5M3 16.5l9 4.5 9-4.5" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="459" font-size="13" fill="#0a6b62" font-weight="700" class="m">07</text><text x="92" y="459" font-size="15" fill="#1f2328" font-weight="600">Atomic snapshot</text><text x="68" y="477" font-size="13" fill="#59636e">publish together</text><circle cx="38" cy="512" r="17" fill="#ffffff" stroke="#b3a8ea"/><g transform="translate(26 500)"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9-1.9 5.6-1.9-5.6-5.6-1.9 5.6-1.9z" fill="#ece9fb" stroke="#5a45c4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 16.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="#5a45c4" stroke="#5a45c4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="509" font-size="13" fill="#5a45c4" font-weight="700" class="m">08</text><text x="92" y="509" font-size="15" fill="#1f2328" font-weight="600">LLM agent</text><text x="68" y="527" font-size="13" fill="#59636e">reasoning via MCP</text><circle cx="38" cy="562" r="17" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(26 550)"><path d="M12 2.5l8 3v6.2c0 5-3.4 8.3-8 9.8-4.6-1.5-8-4.8-8-9.8V5.5z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.4 12.2l2.6 2.6 4.8-5.2" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="559" font-size="13" fill="#0a6b62" font-weight="700" class="m">09</text><text x="92" y="559" font-size="15" fill="#1f2328" font-weight="600">Action gate</text><text x="68" y="577" font-size="13" fill="#59636e">policy + freshness</text><circle cx="38" cy="612" r="17" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(26 600)"><path d="M6 3.5l12.5 8.2-5.4 1.1 3.3 6.4-2.4 1.2-3.2-6.4-4.1 3.6z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="609" font-size="13" fill="#0a6b62" font-weight="700" class="m">10</text><text x="92" y="609" font-size="15" fill="#1f2328" font-weight="600">OS actuator</text><text x="68" y="627" font-size="13" fill="#59636e">authorised input</text><circle cx="38" cy="662" r="17" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(26 650)"><path d="M2 12c2.6-4.4 6-6.5 10-6.5s7.4 2.1 10 6.5c-2.6 4.4-6 6.5-10 6.5S4.6 16.4 2 12z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="#0a6b62"/></g><text x="68" y="659" font-size="13" fill="#0a6b62" font-weight="700" class="m">11</text><text x="92" y="659" font-size="15" fill="#1f2328" font-weight="600">Effect verifier</text><text x="68" y="677" font-size="13" fill="#59636e">report uncertainty</text><path d="M20 696h320" fill="none" stroke="#d1d9e0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="720" font-size="13" fill="#59636e">Every delivery spends the snapshot:</text><text x="20" y="738" font-size="13" fill="#59636e">observe again before acting.</text></svg>
