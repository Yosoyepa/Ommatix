<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1072" aria-labelledby="title desc" role="img" viewBox="0 0 600 1072"><title id="title">Ommatix observation and action pipeline</title><desc id="desc">Capture, region planning, detector and OCR, spatial fusion, icon cache, identity, atomic snapshot, agent, action gate, actuator and effect verification. Numbered arrows show the order.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}</style><rect width="600" height="1072" fill="#f3f6fa" stroke="#cad6df" rx="24"/><text x="32" y="48" fill="#132b40" font-size="19" font-weight="700">FROM A FRAME TO AN ACCOUNTABLE ACTION</text><text x="32" y="80" fill="#4f6375" font-size="17">Perception stays local. Reasoning stays with the agent.</text><rect width="256" height="128" x="24" y="112" fill="#fff" stroke="#cad6df" rx="16"/><text x="40" y="140" fill="#006c65" font-size="16" font-weight="700">01</text><text x="40" y="176" fill="#132b40" font-size="23" font-weight="650">Capture</text><text x="40" y="212" fill="#4f6375" font-size="17">frame + dirty rectangles</text><path fill="none" stroke="#006c65" stroke-width="2.5" d="M284 176h24m-8-7 8 7-8 7"/><rect width="256" height="128" x="312" y="112" fill="#fff" stroke="#cad6df" rx="16"/><text x="328" y="140" fill="#006c65" font-size="16" font-weight="700">02</text><text x="328" y="176" fill="#132b40" font-size="23" font-weight="650">Region plan</text><text x="328" y="212" fill="#4f6375" font-size="17">committed base + halo</text><path fill="none" stroke="#006c65" stroke-width="2" d="M440 240v24m-7-7 7 7 7-7"/><rect width="256" height="128" x="312" y="272" fill="#fff" stroke="#cad6df" rx="16"/><text x="328" y="300" fill="#006c65" font-size="16" font-weight="700">03</text><text x="328" y="336" fill="#132b40" font-size="23" font-weight="650">Detector + OCR</text><text x="328" y="372" fill="#4f6375" font-size="17">planned regions only</text><path fill="none" stroke="#006c65" stroke-width="2" d="M308 336h-24m8-7-8 7 8 7"/><rect width="256" height="128" x="24" y="272" fill="#fff" stroke="#cad6df" rx="16"/><text x="40" y="300" fill="#006c65" font-size="16" font-weight="700">04</text><text x="40" y="336" fill="#132b40" font-size="23" font-weight="650">Spatial fusion</text><text x="40" y="372" fill="#4f6375" font-size="17">visual + optional UIA</text><path fill="none" stroke="#006c65" stroke-width="2" d="M152 400v24m-7-7 7 7 7-7"/><rect width="256" height="128" x="24" y="432" fill="#fff" stroke="#cad6df" rx="16"/><text x="40" y="460" fill="#006c65" font-size="16" font-weight="700">05</text><text x="40" y="496" fill="#132b40" font-size="23" font-weight="650">Icon cache</text><text x="40" y="532" fill="#4f6375" font-size="17">curated; may abstain</text><path fill="none" stroke="#006c65" stroke-width="2.5" d="M284 496h24m-8-7 8 7-8 7"/><rect width="256" height="128" x="312" y="432" fill="#fff" stroke="#cad6df" rx="16"/><text x="328" y="460" fill="#006c65" font-size="16" font-weight="700">06</text><text x="328" y="496" fill="#132b40" font-size="23" font-weight="650">Identity</text><text x="328" y="532" fill="#4f6375" font-size="17">session IDs + revisions</text><path fill="none" stroke="#006c65" stroke-width="2" d="M440 560v24m-7-7 7 7 7-7"/><rect width="256" height="128" x="312" y="592" fill="#fff" stroke="#cad6df" rx="16"/><text x="328" y="620" fill="#006c65" font-size="16" font-weight="700">07</text><text x="328" y="656" fill="#132b40" font-size="23" font-weight="650">Atomic snapshot</text><text x="328" y="692" fill="#4f6375" font-size="17">publish together</text><path fill="none" stroke="#006c65" stroke-width="2" d="M308 656h-24m8-7-8 7 8 7"/><rect width="256" height="128" x="24" y="592" fill="#fff" stroke="#cad6df" rx="16"/><text x="40" y="620" fill="#006c65" font-size="16" font-weight="700">08</text><text x="40" y="656" fill="#132b40" font-size="23" font-weight="650">LLM agent</text><text x="40" y="692" fill="#4f6375" font-size="17">reasoning via MCP</text><path fill="none" stroke="#006c65" stroke-width="2" d="M152 720v24m-7-7 7 7 7-7"/><rect width="256" height="128" x="24" y="752" fill="#fff" stroke="#cad6df" rx="16"/><text x="40" y="780" fill="#006c65" font-size="16" font-weight="700">09</text><text x="40" y="816" fill="#132b40" font-size="23" font-weight="650">Action gate</text><text x="40" y="852" fill="#4f6375" font-size="17">policy + freshness</text><path fill="none" stroke="#006c65" stroke-width="2.5" d="M284 816h24m-8-7 8 7-8 7"/><rect width="256" height="128" x="312" y="752" fill="#fff" stroke="#cad6df" rx="16"/><text x="328" y="780" fill="#006c65" font-size="16" font-weight="700">10</text><text x="328" y="816" fill="#132b40" font-size="23" font-weight="650">OS actuator</text><text x="328" y="852" fill="#4f6375" font-size="17">authorised input</text><path fill="none" stroke="#006c65" stroke-width="2" d="M440 880v24m-7-7 7 7 7-7"/><rect width="256" height="128" x="312" y="912" fill="#fff" stroke="#cad6df" rx="16"/><text x="328" y="940" fill="#006c65" font-size="16" font-weight="700">11</text><text x="328" y="976" fill="#132b40" font-size="23" font-weight="650">Effect verifier</text><text x="328" y="1012" fill="#4f6375" font-size="17">report uncertainty</text></svg>
