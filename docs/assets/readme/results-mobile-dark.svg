<svg xmlns="http://www.w3.org/2000/svg" width="600" height="808" aria-labelledby="title desc" role="img" viewBox="0 0 600 808"><title id="title">Preliminary AG-02 scores, not a model ranking</title><desc id="desc">Phase 1: Haiku 10 of 11, DeepSeek 11 of 11, MiMo 10 of 11. Phase 2: 6, 7 and 7 of 11. Scores include abstentions. Phase 1 exempts the decoy verdict. One series per model and phase; no VLM baseline.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}</style><rect width="600" height="808" fill="#0d1b2a" stroke="#3c5369" rx="24"/><text x="32" y="48" fill="#f0f6fc" font-size="22" font-weight="700">AG-02 / PRELIMINARY</text><text x="32" y="80" fill="#adbdce" font-size="17">Scores out of 11 goals, including correct abstentions</text><rect width="16" height="16" x="32" y="104" fill="#adbdce" rx="3"/><text x="56" y="120" fill="#adbdce" font-size="18">Phase 1 · dry run</text><rect width="16" height="16" x="312" y="104" fill="#68e1ce" rx="3"/><text x="336" y="120" fill="#adbdce" font-size="18">Phase 2 · live</text><text x="32" y="168" fill="#f0f6fc" font-size="24" font-weight="600">Claude Haiku 5.5</text><rect width="448" height="16" x="32" y="192" fill="#142b3f" stroke="#3c5369" rx="5"/><rect width="407.273" height="16" x="32" y="192" fill="#adbdce" rx="5"/><text x="496" y="206" fill="#f0f6fc" font-size="18" font-weight="650">10/11</text><rect width="448" height="16" x="32" y="220" fill="#142b3f" stroke="#3c5369" rx="5"/><rect width="244.364" height="16" x="32" y="220" fill="#68e1ce" rx="5"/><text x="496" y="234" fill="#f0f6fc" font-size="18" font-weight="650">6/11</text><text x="32" y="352" fill="#f0f6fc" font-size="24" font-weight="600">DeepSeek V4.1 Flash*</text><rect width="448" height="16" x="32" y="376" fill="#142b3f" stroke="#3c5369" rx="5"/><rect width="448" height="16" x="32" y="376" fill="#adbdce" rx="5"/><text x="496" y="390" fill="#f0f6fc" font-size="18" font-weight="650">11/11</text><rect width="448" height="16" x="32" y="404" fill="#142b3f" stroke="#3c5369" rx="5"/><rect width="285.091" height="16" x="32" y="404" fill="#68e1ce" rx="5"/><text x="496" y="418" fill="#f0f6fc" font-size="18" font-weight="650">7/11</text><text x="32" y="536" fill="#f0f6fc" font-size="24" font-weight="600">MiMo V2.6 Flash</text><rect width="448" height="16" x="32" y="560" fill="#142b3f" stroke="#3c5369" rx="5"/><rect width="407.273" height="16" x="32" y="560" fill="#adbdce" rx="5"/><text x="496" y="574" fill="#f0f6fc" font-size="18" font-weight="650">10/11</text><rect width="448" height="16" x="32" y="588" fill="#142b3f" stroke="#3c5369" rx="5"/><rect width="285.091" height="16" x="32" y="588" fill="#68e1ce" rx="5"/><text x="496" y="602" fill="#f0f6fc" font-size="18" font-weight="650">7/11</text><text x="32" y="736" fill="#adbdce" font-size="16">One series per model and phase · two synthetic apps · one machine</text><text x="32" y="764" fill="#adbdce" font-size="16">Phase 1 scores choices; its decoy-goal verdict is exempt.</text><text x="32" y="790" fill="#adbdce" font-size="14">* Version attributed to provider documentation; the run records an alias.</text></svg>
