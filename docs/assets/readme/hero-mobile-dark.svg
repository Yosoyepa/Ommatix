<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-labelledby="title desc"><title id="title">Ommatix: a stable interface to a changing desktop</title><desc id="desc">Left, a simulated window divided into tiles; the tiles that changed are marked and one control is outlined. Right, what the agent receives: element e7, a button at revision 3, and e8, a text node at revision 1, with no coordinates.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style><rect x="0.5" y="0.5" width="359" height="299" rx="10" fill="#151b23" stroke="#3d444d"/><polygon points="33.98,39.3 30,41.6 26.02,39.3 26.02,34.7 30,32.4 33.98,34.7" fill="#4fd1bd" stroke="#4fd1bd" stroke-width="1" stroke-linejoin="round"/><polygon points="42.54,39.3 38.56,41.6 34.57,39.3 34.57,34.7 38.56,32.4 42.54,34.7" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1" stroke-linejoin="round"/><polygon points="38.26,31.89 34.28,34.19 30.29,31.89 30.29,27.29 34.28,24.99 38.26,27.29" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1" stroke-linejoin="round"/><polygon points="29.71,31.89 25.72,34.19 21.74,31.89 21.74,27.29 25.72,24.99 29.71,27.29" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1" stroke-linejoin="round"/><polygon points="25.43,39.3 21.44,41.6 17.46,39.3 17.46,34.7 21.44,32.4 25.43,34.7" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1" stroke-linejoin="round"/><polygon points="29.71,46.71 25.72,49.01 21.74,46.71 21.74,42.11 25.72,39.81 29.71,42.11" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1" stroke-linejoin="round"/><polygon points="38.26,46.71 34.28,49.01 30.29,46.71 30.29,42.11 34.28,39.81 38.26,42.11" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1" stroke-linejoin="round"/><text x="50" y="41" font-size="12" fill="#4fd1bd" font-weight="600" letter-spacing="0.9">PERCEPTION · IDENTITY · CONTROL</text><text x="20" y="78" font-size="24" fill="#f0f6fc" font-weight="700">A stable interface</text><text x="20" y="108" font-size="24" fill="#f0f6fc" font-weight="700">to a changing desktop.</text><text x="20" y="134" font-size="13" fill="#9198a1">The screen changes. The element keeps its ID.</text><text x="20" y="168" font-size="12" fill="#9198a1" font-weight="600" letter-spacing="0.9">PIXELS STAY LOCAL</text><rect x="20" y="178" width="118" height="102" rx="6" fill="#0d1117" stroke="#3d444d"/><path d="M20 196h118" fill="none" stroke="#3d444d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="187" r="2.5" fill="#3d444d"/><circle cx="39" cy="187" r="2.5" fill="#3d444d"/><circle cx="48" cy="187" r="2.5" fill="#3d444d"/><rect x="29.83" y="205.55" width="43.27" height="6" rx="3" fill="#656c76"/><rect x="29.83" y="223.25" width="70.8" height="12.19" rx="3" fill="#212830" stroke="#3d444d"/><rect x="29.83" y="243.9" width="55.07" height="5" rx="2.5" fill="#212830"/><rect x="29.83" y="253.9" width="39.33" height="5" rx="2.5" fill="#212830"/><rect x="21" y="219.33" width="17.67" height="17.67" rx="2" fill="#32270a" stroke="#7d6220" fill-opacity="0.75"/><rect x="40.67" y="219.33" width="17.67" height="17.67" rx="2" fill="#32270a" stroke="#7d6220" fill-opacity="0.75"/><rect x="60.33" y="219.33" width="17.67" height="17.67" rx="2" fill="#32270a" stroke="#7d6220" fill-opacity="0.75"/><rect x="80" y="219.33" width="17.67" height="17.67" rx="2" fill="#32270a" stroke="#7d6220" fill-opacity="0.75"/><rect x="29.83" y="223.25" width="70.8" height="12.19" rx="3" fill="none" stroke="#e3b341"/><path d="M39.67 198.67v78.67M59.33 198.67v78.67M79 198.67v78.67M98.67 198.67v78.67M118.33 198.67v78.67M20 198.67h118M20 218.33h118M20 238h118M20 257.67h118M20 277.33h118" fill="none" stroke="#3d444d" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="89.82" y="261.21" width="41.3" height="12.59" rx="4" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5"/><rect x="98.9" y="265" width="23.13" height="5" rx="2.5" fill="#4fd1bd"/><path d="M142 229L156 229M151.5 224.5L156 229L151.5 233.5" fill="none" stroke="#4fd1bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="162" y="168" font-size="12" fill="#b3a6ff" font-weight="600" letter-spacing="0.9">THE AGENT GETS</text><rect x="162" y="178" width="178" height="102" rx="6" fill="#0d1117" stroke="#3d444d"/><rect x="172" y="184" width="29" height="22" rx="4" fill="#0f2e2c" stroke="#1f7a70"/><text x="186.5" y="199.5" font-size="12" fill="#4fd1bd" font-weight="600" text-anchor="middle" class="m">e7</text><text x="209" y="199.2" font-size="12" fill="#f0f6fc" class="m">button</text><text x="330" y="199.2" font-size="12" fill="#9198a1" text-anchor="end" class="m">rev 3</text><path d="M162 212h178" fill="none" stroke="#3d444d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="172" y="218" width="29" height="22" rx="4" fill="#0f2e2c" stroke="#1f7a70"/><text x="186.5" y="233.5" font-size="12" fill="#4fd1bd" font-weight="600" text-anchor="middle" class="m">e8</text><text x="209" y="233.2" font-size="12" fill="#f0f6fc" class="m">text_node</text><text x="330" y="233.2" font-size="12" fill="#9198a1" text-anchor="end" class="m">rev 1</text><path d="M162 246h178" fill="none" stroke="#3d444d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="172" y="267.2" font-size="12" fill="#9198a1" class="m">x 412, y 388</text><path d="M170 263h91.84" fill="none" stroke="#e3b341" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="267.2" font-size="12" fill="#e3b341" font-weight="600" text-anchor="end">never sent</text></svg>
