<svg xmlns="http://www.w3.org/2000/svg" width="600" height="304" aria-labelledby="title desc" role="img" viewBox="0 0 600 304"><title id="title">Ommatix: a stable interface to a changing desktop</title><desc id="desc">A grid highlights local changes; a structured element keeps its identifier and revision.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}</style><rect width="600" height="304" fill="#0d1b2a" stroke="#3c5369" rx="24"/><text x="40" y="56" fill="#68e1ce" font-size="16" font-weight="650" letter-spacing="2">PERCEPTION / IDENTITY / CONTROL</text><text x="40" y="112" fill="#f0f6fc" font-size="38" font-weight="700">A stable interface</text><text x="40" y="166" fill="#f0f6fc" font-size="38" font-weight="700">to a changing desktop.</text><rect width="520" height="56" x="40" y="208" fill="#142b3f" stroke="#3c5369" rx="12"/><text x="64" y="244" fill="#adbdce" font-size="22">changed region</text><path fill="none" stroke="#68e1ce" stroke-width="2.5" d="M248 236h24m-8-7 8 7-8 7"/><text x="304" y="244" fill="#68e1ce" font-size="22">e7 · revision 3</text></svg>
