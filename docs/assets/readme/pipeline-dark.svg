<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" width="840" height="390" role="img" aria-labelledby="title desc"><title id="title">Ommatix observation and action pipeline</title><desc id="desc">Eleven numbered stages. The engine captures a frame, plans the changed regions, runs the detector and OCR on them, fuses the evidence, resolves icons, tracks identity and publishes an atomic snapshot. The LLM agent reasons over MCP. The engine then gates the action, delivers authorised input and verifies the effect. Every delivery spends the snapshot.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style><rect x="0.5" y="0.5" width="839" height="389" rx="10" fill="#151b23" stroke="#3d444d"/><text x="24" y="42" font-size="20" fill="#f0f6fc" font-weight="700">From a frame to an accountable action</text><text x="24" y="65" font-size="14" fill="#9198a1">Perception stays local. Reasoning stays with the agent.</text><circle cx="692.55" cy="37.5" r="4" fill="#b3a6ff"/><text x="702.55" y="42" font-size="13" fill="#9198a1">Agent (MCP client)</text><circle cx="521.57" cy="37.5" r="4" fill="#4fd1bd"/><text x="531.57" y="42" font-size="13" fill="#9198a1">Ommatix engine (local)</text><rect x="24" y="92" width="186" height="74" rx="8" fill="#0d1117" stroke="#3d444d"/><text x="38" y="115" font-size="13" fill="#4fd1bd" font-weight="700" class="m">01</text><g transform="translate(172 102)"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5"/><path d="M2.5 9h19" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="38" y="138" font-size="15" fill="#f0f6fc" font-weight="600">Capture</text><text x="38" y="155" font-size="13" fill="#9198a1">frame + dirty rectangles</text><path d="M212.5 129L223.5 129M219.5 125L223.5 129L219.5 133" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="226" y="92" width="186" height="74" rx="8" fill="#0d1117" stroke="#3d444d"/><text x="240" y="115" font-size="13" fill="#4fd1bd" font-weight="700" class="m">02</text><g transform="translate(374 102)"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="#4fd1bd" stroke-width="1.5"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18" fill="none" stroke="#4fd1bd" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="9" y="9" width="6" height="6" fill="#4fd1bd"/><rect x="15" y="9" width="6" height="6" fill="#4fd1bd"/></g><text x="240" y="138" font-size="15" fill="#f0f6fc" font-weight="600">Region plan</text><text x="240" y="155" font-size="13" fill="#9198a1">committed base + halo</text><path d="M414.5 129L425.5 129M421.5 125L425.5 129L421.5 133" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="428" y="92" width="186" height="74" rx="8" fill="#0d1117" stroke="#3d444d"/><text x="442" y="115" font-size="13" fill="#4fd1bd" font-weight="700" class="m">03</text><g transform="translate(576 102)"><rect x="2.5" y="5.5" width="19" height="13" rx="2" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-dasharray="3 2.5"/><path d="M7 15l2.5-6 2.5 6M8 13.2h3M14.5 12.3a1.8 1.8 0 1 0 0 2.4M16.3 10.6v4.4" fill="none" stroke="#4fd1bd" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="442" y="138" font-size="15" fill="#f0f6fc" font-weight="600">Detector + OCR</text><text x="442" y="155" font-size="13" fill="#9198a1">planned regions only</text><path d="M616.5 129L627.5 129M623.5 125L627.5 129L623.5 133" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="630" y="92" width="186" height="74" rx="8" fill="#0d1117" stroke="#3d444d"/><text x="644" y="115" font-size="13" fill="#4fd1bd" font-weight="700" class="m">04</text><g transform="translate(778 102)"><rect x="3" y="4" width="12" height="11" rx="2" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5"/><rect x="9" y="9" width="12" height="11" rx="2" fill="none" stroke="#4fd1bd" stroke-width="1.5"/></g><text x="644" y="138" font-size="15" fill="#f0f6fc" font-weight="600">Spatial fusion</text><text x="644" y="155" font-size="13" fill="#9198a1">visual + optional UIA</text><path d="M723 168L723 173Q723 179 717 179L123 179Q117 179 117 185L117 189.5M113 185.5L117 189.5L121 185.5" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="192" width="186" height="74" rx="8" fill="#0d1117" stroke="#3d444d"/><text x="38" y="215" font-size="13" fill="#4fd1bd" font-weight="700" class="m">05</text><g transform="translate(172 202)"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" fill="none" stroke="#4fd1bd" stroke-width="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5" fill="none" stroke="#4fd1bd" stroke-width="1.5"/><path d="M15.2 15.6a2.2 2.2 0 1 1 3 2.1c-.7.4-.9.8-.9 1.4M17.3 21v.1" fill="none" stroke="#4fd1bd" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="38" y="238" font-size="15" fill="#f0f6fc" font-weight="600">Icon cache</text><text x="38" y="255" font-size="13" fill="#9198a1">curated; may abstain</text><path d="M212.5 229L223.5 229M219.5 225L223.5 229L219.5 233" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="226" y="192" width="186" height="74" rx="8" fill="#0d1117" stroke="#3d444d"/><text x="240" y="215" font-size="13" fill="#4fd1bd" font-weight="700" class="m">06</text><g transform="translate(374 202)"><path d="M3.5 4.5h8.2l8.8 8.8-7.2 7.2-9.8-9.8z" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.6" fill="#4fd1bd"/></g><text x="240" y="238" font-size="15" fill="#f0f6fc" font-weight="600">Identity</text><text x="240" y="255" font-size="13" fill="#9198a1">session IDs + revisions</text><path d="M414.5 229L425.5 229M421.5 225L425.5 229L421.5 233" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="428" y="192" width="186" height="74" rx="8" fill="#0d1117" stroke="#3d444d"/><text x="442" y="215" font-size="13" fill="#4fd1bd" font-weight="700" class="m">07</text><g transform="translate(576 202)"><path d="M12 3.5l9 4.5-9 4.5-9-4.5z" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12.5l9 4.5 9-4.5M3 16.5l9 4.5 9-4.5" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="442" y="238" font-size="15" fill="#f0f6fc" font-weight="600">Atomic snapshot</text><text x="442" y="255" font-size="13" fill="#9198a1">publish together</text><path d="M616.5 229L627.5 229M623.5 225L627.5 229L623.5 233" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="630" y="192" width="186" height="74" rx="8" fill="#0d1117" stroke="#5a4fa8"/><text x="644" y="215" font-size="13" fill="#b3a6ff" font-weight="700" class="m">08</text><g transform="translate(778 202)"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9-1.9 5.6-1.9-5.6-5.6-1.9 5.6-1.9z" fill="#231f45" stroke="#b3a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 16.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="#b3a6ff" stroke="#b3a6ff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="644" y="238" font-size="15" fill="#f0f6fc" font-weight="600">LLM agent</text><text x="644" y="255" font-size="13" fill="#9198a1">reasoning via MCP</text><path d="M723 268L723 273Q723 279 717 279L123 279Q117 279 117 285L117 289.5M113 285.5L117 289.5L121 285.5" fill