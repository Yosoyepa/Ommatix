-linejoin="round"/><circle cx="12" cy="12" r="3" fill="#4fd1bd"/></g><text x="442" y="338" font-size="15" fill="#f0f6fc" font-weight="600">Effect verifier</text><text x="442" y="355" font-size="13" fill="#9198a1">report uncertainty</text><path d="M616.5 329L627.5 329M623.5 325L627.5 329L623.5 333" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="630" y="292" width="186" height="74" rx="8" fill="none" stroke="#1f7a70" stroke-dasharray="4 3"/><text x="644" y="316" font-size="13" fill="#9198a1">Every delivery spends</text><text x="644" y="334" font-size="13" fill="#9198a1">the snapshot: observe</text><text x="644" y="352" font-size="13" fill="#9198a1">again before acting.</text></svg>
