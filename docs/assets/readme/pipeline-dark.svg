<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="592" aria-labelledby="title desc" role="img" viewBox="0 0 1200 592"><title id="title">Ommatix observation and action pipeline</title><desc id="desc">Capture, region planning, detector and OCR, spatial fusion, icon cache, identity, atomic snapshot, agent, action gate, actuator and effect verification. Numbered arrows show the order.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}</style><rect width="1200" height="592" fill="#0d1b2a" stroke="#3c5369" rx="24"/><text x="32" y="48" fill="#f0f6fc" font-size="23" font-weight="700">FROM A FRAME TO AN ACCOUNTABLE ACTION</text><text x="32" y="80" fill="#adbdce" font-size="20">Perception stays local. Reasoning stays with the agent.</text><rect width="264" height="128" x="24" y="112" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="40" y="140" fill="#68e1ce" font-size="16" font-weight="700">01</text><text x="40" y="176" fill="#f0f6fc" font-size="23" font-weight="650">Capture</text><text x="40" y="212" fill="#adbdce" font-size="17">frame + dirty rectangles</text><path fill="none" stroke="#68e1ce" stroke-width="2.5" d="M292 176h24m-8-7 8 7-8 7"/><rect width="264" height="128" x="320" y="112" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="336" y="140" fill="#68e1ce" font-size="16" font-weight="700">02</text><text x="336" y="176" fill="#f0f6fc" font-size="23" font-weight="650">Region plan</text><text x="336" y="212" fill="#adbdce" font-size="17">committed base + halo</text><path fill="none" stroke="#68e1ce" stroke-width="2.5" d="M588 176h24m-8-7 8 7-8 7"/><rect width="264" height="128" x="616" y="112" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="632" y="140" fill="#68e1ce" font-size="16" font-weight="700">03</text><text x="632" y="176" fill="#f0f6fc" font-size="23" font-weight="650">Detector + OCR</text><text x="632" y="212" fill="#adbdce" font-size="17">planned regions only</text><path fill="none" stroke="#68e1ce" stroke-width="2.5" d="M884 176h24m-8-7 8 7-8 7"/><rect width="264" height="128" x="912" y="112" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="928" y="140" fill="#68e1ce" font-size="16" font-weight="700">04</text><text x="928" y="176" fill="#f0f6fc" font-size="23" font-weight="650">Spatial fusion</text><text x="928" y="212" fill="#adbdce" font-size="17">visual + optional UIA</text><path fill="none" stroke="#68e1ce" stroke-width="2" d="M1044 240v24m-7-7 7 7 7-7"/><rect width="264" height="128" x="912" y="272" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="928" y="300" fill="#68e1ce" font-size="16" font-weight="700">05</text><text x="928" y="336" fill="#f0f6fc" font-size="23" font-weight="650">Icon cache</text><text x="928" y="372" fill="#adbdce" font-size="17">curated; may abstain</text><path fill="none" stroke="#68e1ce" stroke-width="2" d="M908 336h-24m8-7-8 7 8 7"/><rect width="264" height="128" x="616" y="272" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="632" y="300" fill="#68e1ce" font-size="16" font-weight="700">06</text><text x="632" y="336" fill="#f0f6fc" font-size="23" font-weight="650">Identity</text><text x="632" y="372" fill="#adbdce" font-size="17">session IDs + revisions</text><path fill="none" stroke="#68e1ce" stroke-width="2" d="M612 336h-24m8-7-8 7 8 7"/><rect width="264" height="128" x="320" y="272" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="336" y="300" fill="#68e1ce" font-size="16" font-weight="700">07</text><text x="336" y="336" fill="#f0f6fc" font-size="23" font-weight="650">Atomic snapshot</text><text x="336" y="372" fill="#adbdce" font-size="17">publish together</text><path fill="none" stroke="#68e1ce" stroke-width="2" d="M316 336h-24m8-7-8 7 8 7"/><rect width="264" height="128" x="24" y="272" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="40" y="300" fill="#68e1ce" font-size="16" font-weight="700">08</text><text x="40" y="336" fill="#f0f6fc" font-size="23" font-weight="650">LLM agent</text><text x="40" y="372" fill="#adbdce" font-size="17">reasoning via MCP</text><path fill="none" stroke="#68e1ce" stroke-width="2" d="M156 400v24m-7-7 7 7 7-7"/><rect width="264" height="128" x="24" y="432" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="40" y="460" fill="#68e1ce" font-size="16" font-weight="700">09</text><text x="40" y="496" fill="#f0f6fc" font-size="23" font-weight="650">Action gate</text><text x="40" y="532" fill="#adbdce" font-size="17">policy + freshness</text><path fill="none" stroke="#68e1ce" stroke-width="2.5" d="M292 496h24m-8-7 8 7-8 7"/><rect width="264" height="128" x="320" y="432" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="336" y="460" fill="#68e1ce" font-size="16" font-weight="700">10</text><text x="336" y="496" fill="#f0f6fc" font-size="23" font-weight="650">OS actuator</text><text x="336" y="532" fill="#adbdce" font-size="17">authorised input</text><path fill="none" stroke="#68e1ce" stroke-width="2.5" d="M588 496h24m-8-7 8 7-8 7"/><rect width="264" height="128" x="616" y="432" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="632" y="460" fill="#68e1ce" font-size="16" font-weight="700">11</text><text x="632" y="496" fill="#f0f6fc" font-size="23" font-weight="650">Effect verifier</text><text x="632" y="532" fill="#adbdce" font-size="17">report uncertainty</text></svg>
