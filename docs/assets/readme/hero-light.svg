<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 206" width="840" height="206" role="img" aria-labelledby="title desc"><title id="title">Ommatix: a stable interface to a changing desktop</title><desc id="desc">Left, a simulated window divided into tiles; the tiles that changed are marked and one control is outlined. Right, what the agent receives: element e7, a button at revision 3, and e8, a text node at revision 1, with no coordinates.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style><rect x="0.5" y="0.5" width="839" height="205" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><polygon points="50.5,48.6 46,51.2 41.5,48.6 41.5,43.4 46,40.8 50.5,43.4" fill="#0a6b62" stroke="#0a6b62" stroke-width="1" stroke-linejoin="round"/><polygon points="60.18,48.6 55.67,51.2 51.17,48.6 51.17,43.4 55.67,40.8 60.18,43.4" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1" stroke-linejoin="round"/><polygon points="55.34,40.22 50.84,42.82 46.33,40.22 46.33,35.02 50.84,32.42 55.34,35.02" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1" stroke-linejoin="round"/><polygon points="45.67,40.22 41.16,42.82 36.66,40.22 36.66,35.02 41.16,32.42 45.67,35.02" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1" stroke-linejoin="round"/><polygon points="40.83,48.6 36.33,51.2 31.82,48.6 31.82,43.4 36.33,40.8 40.83,43.4" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1" stroke-linejoin="round"/><polygon points="45.67,56.98 41.16,59.58 36.66,56.98 36.66,51.78 41.16,49.18 45.67,51.78" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1" stroke-linejoin="round"/><polygon points="55.34,56.98 50.84,59.58 46.33,56.98 46.33,51.78 50.84,49.18 55.34,51.78" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1" stroke-linejoin="round"/><text x="70" y="50" font-size="12" fill="#0a6b62" font-weight="600" letter-spacing="0.9">PERCEPTION · IDENTITY · CONTROL</text><text x="32" y="100" font-size="31" fill="#1f2328" font-weight="700">A stable interface</text><text x="32" y="138" font-size="31" fill="#1f2328" font-weight="700">to a changing desktop.</text><text x="32" y="170" font-size="14" fill="#59636e">The screen changes. The element keeps its ID.</text><text x="392" y="36" font-size="12" fill="#59636e" font-weight="600" letter-spacing="0.9">PIXELS STAY LOCAL</text><rect x="392" y="46" width="168" height="136" rx="6" fill="#ffffff" stroke="#d1d9e0"/><path d="M392 64h168" fill="none" stroke="#d1d9e0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="402" cy="55" r="2.5" fill="#d1d9e0"/><circle cx="411" cy="55" r="2.5" fill="#d1d9e0"/><circle cx="420" cy="55" r="2.5" fill="#d1d9e0"/><rect x="406" y="76.8" width="61.6" height="6" rx="3" fill="#afb8c1"/><rect x="406" y="102" width="100.8" height="17.36" rx="3" fill="#eaeef2" stroke="#d1d9e0"/><rect x="406" y="131.4" width="78.4" height="5" rx="2.5" fill="#eaeef2"/><rect x="406" y="141.4" width="56" height="5" rx="2.5" fill="#eaeef2"/><rect x="393" y="96" width="26" height="26" rx="2" fill="#fff1cf" stroke="#dcb25a" fill-opacity="0.75"/><rect x="421" y="96" width="26" height="26" rx="2" fill="#fff1cf" stroke="#dcb25a" fill-opacity="0.75"/><rect x="449" y="96" width="26" height="26" rx="2" fill="#fff1cf" stroke="#dcb25a" fill-opacity="0.75"/><rect x="477" y="96" width="26" height="26" rx="2" fill="#fff1cf" stroke="#dcb25a" fill-opacity="0.75"/><rect x="406" y="102" width="100.8" height="17.36" rx="3" fill="none" stroke="#8a5300"/><path d="M420 67v112M448 67v112M476 67v112M504 67v112M532 67v112M392 67h168M392 95h168M392 123h168M392 151h168M392 179h168" fill="none" stroke="#d1d9e0" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="491.4" y="156.04" width="58.8" height="17.92" rx="4" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5"/><rect x="504.34" y="162.5" width="32.93" height="5" rx="2.5" fill="#0a6b62"/><path d="M570 114L5