<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 704" width="360" height="704" role="img" aria-labelledby="title desc"><title id="title">Fail-closed action gate</title><desc id="desc">Every action first passes a reference check: snapshot, target, revision and age. A dry run, the default, then returns simulated and delivers nothing. Live input, off by default, must also pass the operator&#x27;s policy, the allowed foreground application, a fresh screen and a last look before one input is delivered and its effect verified. Any failed check is rejected and delivers nothing. A delivery reports input_delivered, effect_observed or indeterminate, which is never retried.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style><rect x="0.5" y="0.5" width="359" height="703" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="20" y="38" font-size="19" fill="#1f2328" font-weight="700">Fail closed: every action</text><text x="20" y="62" font-size="19" fill="#1f2328" font-weight="700">passes the gate</text><text x="20" y="84" font-size="13" fill="#59636e">A dry run is the default.</text><text x="20" y="101" font-size="13" fill="#59636e">Live input needs every check, every time.</text><rect x="20" y="116" width="129" height="26" rx="13" fill="#ece9fb" stroke="#b3a8ea"/><text x="84.5" y="133.55" font-size="13" fill="#5a45c4" font-weight="600" text-anchor="middle" class="m">execute_action</text><path d="M84.5 145L84.5 157M80.5 153L84.5 157L88.5 153" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="160" width="320" height="48" rx="8" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(32 172)"><path d="M3.5 4.5h8.2l8.8 8.8-7.2 7.2-9.8-9.8z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.6" fill="#0a6b62"/></g><text x="66" y="180" font-size="15" fill="#1f2328" font-weight="600">Reference</text><text x="66" y="198" font-size="13" fill="#59636e">snapshot · target · revision · age</text><path d="M38 210L38 224M34 220L38 224L42 220" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="58" y="216" width="85" height="22" rx="4" fill="#dcf3ee" stroke="#7fc8bc"/><text x="100.5" y="231.5" font-size="13" fill="#0a6b62" font-weight="600" text-anchor="middle" class="m">simulated</text><text x="151" y="231.5" font-size="13" fill="#0a6b62" font-weight="600">dry run · default</text><text x="20" y="262" font-size="13" fill="#8a5300" font-weight="600">live input · dry_run: false · off by default</text><path d="M38 292V522" fill="none" stroke="#d1d9e0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="38" cy="292" r="16" fill="#ffffff" stroke="#d1d9e0"/><g transform="translate(27 281) scale(0.92)"><path d="M12 2.5l8 3v6.2c0 5-3.4 8.3-8 9.8-4.6-1.5-8-4.8-8-9.8V5.5z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.4 12.2l2.6 2.6 4.8-5.2" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="289" font-size="15" fill="#1f2328" font-weight="600">Policy</text><text x="66" y="306" font-size="13" fill="#59636e">operator allows</text><circle cx="38" cy="338" r="16" fill="#ffffff" stroke="#d1d9e0"/><g transform="translate(27 327) scale(0.92)"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5"/><path d="M2.5 9h19" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="335" font-size="15" fill="#1f2328" font-weight="600">Foreground</text><text x="66" y="352" font-size="13" fill="#59636e">allowed app</text><circle cx="38" cy="384" r="16" fill="#ffffff" stroke="#d1d9e0"/><g transform="translate(27 373) scale(0.92)"><circle cx="12" cy="12" r="9" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5"/><path d="M12 7v5.2l3.4 2" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="381" font-size="15" fill="#1f2328" font-weight="600">Freshness</text><text x="66" y="398" font-size="13" fill="#59636e">same screen</text><circle cx="38" cy="430" r="16" fill="#ffffff" stroke="#d1d9e0"/><g transform="translate(27 419) scale(0.92)"><path d="M19.8 12a7.8 7.8 0 1 1-2.6-5.8M19.8 3.6v4.6h-4.6" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.2" fill="#0a6b62"/></g><text x="66" y="427" font-size="15" fill="#1f2328" font-weight="600">Last look</text><text x="66" y="444" font-size="13" fill="#59636e">checked again</text><circle cx="38" cy="476" r="16" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(27 465) scale(0.92)"><path d="M6 3.5l12.5 8.2-5.4 1.1 3.3 6.4-2.4 1.2-3.2-6.4-4.1 3.6z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="473" font-size="15" fill="#1f2328" font-weight="600">Deliver</text><text x="66" y="490" font-size="13" fill="#59636e">authorised input</text><circle cx="38" cy="522" r="16" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(27 511) scale(0.92)"><path d="M2 12c2.6-4.4 6-6.5 10-6.5s7.4 2.1 10 6.5c-2.6 4.4-6 6.5-10 6.5S4.6 16.4 2 12z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="#0a6b62"/></g><text x="66" y="519" font-size="15" fill="#1f2328" font-weight="600">Verify</text><text x="66" y="536" font-size="13" fill="#59636e">report the effect</text><path d="M20 552h320" fill="none" stroke="#d1d9e0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="564" width="73" height="22" rx="4" fill="#fff1cf" stroke="#dcb25a"/><text x="56.5" y="579.5" font-size="12" fill="#8a5300" font-weight="600" text-anchor="middle" class="m">rejected</text><text x="101" y="579.5" font-size="13" fill="#59636e">any failed check: nothing delivered</text><text x="20" y="605" font-size="12" fill="#8a5300" class="m">POLICY_DENIED · STALE_SNAPSHOT ·</text><text x="20" y="622" font-size="12" fill="#8a5300" class="m">STALE_TARGET</text><rect x="20" y="636" width="124" height="22" rx="4" fill="#dcf3ee" stroke="#7fc8bc"/><text x="82" y="651.5" font-size="12" fill="#0a6b62" font-weight="600" text-anchor="middle" class="m">input_delivered</text><rect x="150" y="636" width="124" height="22" rx="4" fill="#dcf3ee" stroke="#7fc8bc"/><text x="212" y="651.5" font-size="12" fill="#0a6b62" font-weight="600" text-anchor="middle" class="m">effect_observed</text><rect x="20" y="664" width="109" height="22" rx="4" fill="#fff1cf" stroke="#dcb25a"/><text x="74.5" y="679.5" font-size="12" fill="#8a5300" font-weight="600" text-anchor="middle" class="m">indeterminate</text><text x="138" y="679.5" font-size="13" fill="#59636e">never retried</text></svg>
