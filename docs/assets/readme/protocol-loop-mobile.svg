<svg xmlns="http://www.w3.org/2000/svg" width="600" height="336" aria-labelledby="title desc" role="img" viewBox="0 0 600 336"><title id="title">Animated illustration of Ommatix on a simulated desktop</title><desc id="desc">Cycles through region planning, stable identity, observation, a dry-run action, a stale snapshot refusal and honest reporting. Reduced-motion mode shows a still frame.</desc><style>@keyframes step0{0%{opacity:1}16.666666666666668%,to{opacity:0}}@keyframes step1{0%,33.333333333333336%,to{opacity:0}16.666666666666668%{opacity:1}}@keyframes step2{0%,50%,to{opacity:0}33.333333333333336%{opacity:1}}@keyframes step3{0%,66.66666666666667%,to{opacity:0}50%{opacity:1}}@keyframes step4{0%,83.33333333333333%,to{opacity:0}66.66666666666667%{opacity:1}}@keyframes step5{0%,to{opacity:0}83.33333333333333%{opacity:1}}text{font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}@media (prefers-reduced-motion:reduce){.step{animation:none;opacity:0}}</style><rect width="600" height="336" fill="#0d1b2a" stroke="#3c5369" rx="24"/><text x="32" y="40" fill="#adbdce" font-size="17">SIMULATED DESKTOP / PROTOCOL ILLUSTRATION</text><g class="step" style="animation:step0 30s steps(1,end) infinite"><text x="32" y="104" fill="#68e1ce" font-size="20" font-weight="650" letter-spacing="1">01 / REGION PLAN</text><text x="32" y="152" fill="#f0f6fc" font-size="25" font-weight="650">Re-analyse changed regions</text><rect width="536" height="80" x="32" y="200" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="56" y="235" fill="#f0f6fc" font-size="22">Guardar ejemplo</text><text x="56" y="264" fill="#68e1ce" font-size="19">e7  /  revision 3</text></g><g class="step" opacity="0" style="animation:step1 30s steps(1,end) infinite"><text x="32" y="104" fill="#68e1ce" font-size="20" font-weight="650" letter-spacing="1">02 / IDENTITY</text><text x="32" y="152" fill="#f0f6fc" font-size="25" font-weight="650">e7 · revision 3</text><rect width="536" height="80" x="32" y="200" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="56" y="235" fill="#f0f6fc" font-size="22">Guardar ejemplo</text><text x="56" y="264" fill="#68e1ce" font-size="19">e7  /  revision 3</text></g><g class="step" opacity="0" style="animation:step2 30s steps(1,end) infinite"><text x="32" y="104" fill="#68e1ce" font-size="20" font-weight="650" letter-spacing="1">03 / OBSERVE</text><text x="32" y="152" fill="#f0f6fc" font-size="25" font-weight="650">observe_screen → s17</text><rect width="536" height="80" x="32" y="200" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="56" y="235" fill="#f0f6fc" font-size="22">Guardar ejemplo</text><text x="56" y="264" fill="#68e1ce" font-size="19">e7  /  revision 3</text></g><g class="step" opacity="0" style="animation:step3 30s steps(1,end) infinite"><text x="32" y="104" fill="#68e1ce" font-size="20" font-weight="650" letter-spacing="1">04 / ACT</text><text x="32" y="152" fill="#f0f6fc" font-size="25" font-weight="650">execute_action(e7, revision 3)</text><rect width="536" height="80" x="32" y="200" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="56" y="235" fill="#f0f6fc" font-size="22">Guardar ejemplo</text><text x="56" y="264" fill="#68e1ce" font-size="19">e7  /  revision 3</text></g><g class="step" opacity="0" style="animation:step4 30s steps(1,end) infinite"><text x="32" y="104" fill="#68e1ce" font-size="20" font-weight="650" letter-spacing="1">05 / REFUSE</text><text x="32" y="152" fill="#f0f6fc" font-size="25" font-weight="650">s16 → STALE_SNAPSHOT</text><rect width="536" height="80" x="32" y="200" fill="#142b3f" stroke="#ffd18a" rx="16"/><text x="56" y="235" fill="#f0f6fc" font-size="22">Guardar ejemplo</text><text x="56" y="264" fill="#ffd18a" font-size="19">refused · observe again</text></g><g class="step" opacity="0" style="animation:step5 30s steps(1,end) infinite"><text x="32" y="104" fill="#68e1ce" font-size="20" font-weight="650" letter-spacing="1">06 / REPORT</text><text x="32" y="152" fill="#f0f6fc" font-size="25" font-weight="650">simulated · no input delivered</text><rect width="536" height="80" x="32" y="200" fill="#142b3f" stroke="#3c5369" rx="16"/><text x="56" y="235" fill="#f0f6fc" font-size="22">Guardar ejemplo</text><text x="56" y="264" fill="#68e1ce" font-size="19">e7  /  revision 3</text></g><text x="32" y="312" fill="#adbdce" font-size="15">A schematic of the contract, not a live run or a performance measurement.</text></svg>
