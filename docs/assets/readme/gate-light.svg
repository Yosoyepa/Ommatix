<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" aria-labelledby="title desc" role="img" viewBox="0 0 1200 240"><title id="title">Fail-closed action gate</title><desc id="desc">Default dry run is simulated. Live input requires local policy, foreground attestation, a fresh snapshot and last look before delivery. The result reports delivery and effect separately.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}</style><rect width="1200" height="240" fill="#f3f6fa" stroke="#cad6df" rx="24"/><text x="32" y="48" fill="#132b40" font-size="24" font-weight="700">LIVE INPUT REQUIRES EVERY CHECK</text><rect width="224" height="88" x="24" y="88" fill="#fff" stroke="#cad6df" rx="12"/><text x="40" y="122" fill="#132b40" font-size="23" font-weight="650">Dry run?</text><text x="40" y="153" fill="#4f6375" font-size="16">yes → simulated</text><path fill="none" stroke="#006c65" stroke-width="2.5" d="M248 132h24m-8-7 8 7-8 7"/><rect width="224" height="88" x="256" y="88" fill="#fff" stroke="#cad6df" rx="12"/><text x="272" y="122" fill="#132b40" font-size="23" font-weight="650">Policy</text><text x="272" y="153" fill="#4f6375" font-size="16">operator permits</text><path fill="none" stroke="#006c65" stroke-width="2.5" d="M480 132h24m-8-7 8 7-8 7"/><rect width="224" height="88" x="488" y="88" fill="#fff" stroke="#cad6df" rx="12"/><text x="504" y="122" fill="#132b40" font-size="23" font-weight="650">Foreground</text><text x="504" y="153" fill="#4f6375" font-size="16">allowlist + scope</text><path fill="none" stroke="#006c65" stroke-width="2.5" d="M712 132h24m-8-7 8 7-8 7"/><rect width="224" height="88" x="720" y="88" fill="#fff" stroke="#cad6df" rx="12"/><text x="736" y="122" fill="#132b40" font-size="23" font-weight="650">Freshness</text><text x="736" y="153" fill="#4f6375" font-size="16">snapshot + last look</text><path fill="none" stroke="#006c65" stroke-width="2.5" d="M944 132h24m-8-7 8 7-8 7"/><rect width="224" height="88" x="952" y="88" fill="#fff" stroke="#cad6df" rx="12"/><text x="968" y="122" fill="#132b40" font-size="23" font-weight="650">Deliver</text><text x="968" y="153" fill="#4f6375" font-size="16">then verify</text><text x="32" y="216" fill="#006c65" font-size="20">Any failed check refuses input. Uncertainty never triggers an automatic retry.</text></svg>
