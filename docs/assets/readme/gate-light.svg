<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc"><title id="title">Fail-closed action gate</title><desc id="desc">A request with valid arguments and a new request_id reaches the reference check: snapshot, target, revision and age. A repeated request_id returns its stored result instead. A dry run, the default, then returns simulated. Live input must also pass the operator&#x27;s policy, the allowed foreground application, a comparison of a new capture with the committed base, and a last look. A failed check is rejected and nothing is delivered. A delivery reports input_delivered; a verified visual change reports effect_observed, and an effect that cannot be confirmed reports indeterminate.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style><rect x="0.5" y="0.5" width="839" height="329" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="24" y="42" font-size="20" fill="#1f2328" font-weight="700">Fail-closed action gate</text><rect x="24" y="62" width="262" height="52" rx="8" fill="#ffffff" stroke="#b3a8ea"/><g transform="translate(36 76)"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9-1.9 5.6-1.9-5.6-5.6-1.9 5.6-1.9z" fill="#ece9fb" stroke="#5a45c4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 16.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="#5a45c4" stroke="#5a45c4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="70" y="84" font-size="15" fill="#1f2328" font-weight="600">Request</text><text x="70" y="102" font-size="13" fill="#59636e">valid arguments · new request_id</text><path d="M288.5 88L301.5 88M297.5 84L301.5 88L297.5 92" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="304" y="62" width="266" height="52" rx="8" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(316 76)"><path d="M3.5 4.5h8.2l8.8 8.8-7.2 7.2-9.8-9.8z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.6" fill="#0a6b62"/></g><text x="350" y="84" font-size="15" fill="#1f2328" font-weight="600">Reference</text><text x="350" y="102" font-size="13" fill="#59636e">snapshot · target · revision · age</text><path d="M574 88L692 88M688 84L692 88L688 92" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="632" y="80" font-size="13" fill="#0a6b62" font-weight="600" text-anchor="middle">dry run · default</text><rect x="698" y="77" width="85" height="22" rx="4" fill="#dcf3ee" stroke="#7fc8bc"/><text x="740.5" y="92.5" font-size="13" fill="#0a6b62" font-weight="600" text-anchor="middle" class="m">simulated</text><path d="M328 116L328 138Q328 144 322 144L91 144Q85 144 85 150L85 155.5M81 151.5L85 155.5L89 151.5" fill="none" stroke="#8a5300" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="136" font-size="13" fill="#8a5300" font-weight="600">live · dry_run: false</text><rect x="24" y="158" width="122" height="80" rx="8" fill="#ffffff" stroke="#d1d9e0"/><g transform="translate(36 168) scale(0.92)"><path d="M12 2.5l8 3v6.2c0 5-3.4 8.3-8 9.8-4.6-1.5-8-4.8-8-9.8V5.5z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.4 12.2l2.6 2.6 4.8-5.2" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="36" y="210" font-size="15" fill="#1f2328" font-weight="600">Policy</text><text x="36" y="227" font-size="13" fill="#59636e">operator allows</text><path d="M147.5 198L156.5 198M153 194.5L156.5 198L153 201.5" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="158" y="158" width="122" height="80" rx="8" fill="#ffffff" stroke="#d1d9e0"/><g transform="translate(170 168) scale(0.92)"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5"/><path d="M2.5 9h19" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="170" y="210" font-size="15" fill="#1f2328" font-weight="600">Foreground</text><text x="170" y="227" font-size="13" fill="#59636e">allowed app</text><path d="M281.5 198L290.5 198M287 194.5L290.5 198L287 201.5" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="292" y="158" width="122" height="80" rx="8" fill="#ffffff" stroke="#d1d9e0"/><g transform="translate(304 168) scale(0.92)"><circle cx="12" cy="12" r="9" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5"/><path d="M12 7v5.2l3.4 2" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="304" y="210" font-size="15" fill="#1f2328" font-weight="600">Freshness</text><text x="304" y="227" font-size="13" fill="#59636e">new capture</text><path d="M415.5 198L424.5 198M421 194.5L424.5 198L421 201.5" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="426" y="158" width="122" height="80" rx="8" fill="#ffffff" stroke="#d1d9e0"/><g transform="translate(438 168) scale(0.92)"><path d="M19.8 12a7.8 7.8 0 1 1-2.6-5.8M19.8 3.6v4.6h-4.6" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.2" fill="#0a6b62"/></g><text x="438" y="210" font-size="15" fill="#1f2328" font-weight="600">Last look</text><text x="438" y="227" font-size="13" fill="#59636e">checked again</text><path d="M549.5 198L558.5 198M555 194.5L558.5 198L555 201.5" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="158" width="122" height="80" rx="8" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(572 168) scale(0.92)"><path d="M6 3.5l12.5 8.2-5.4 1.1 3.3 6.4-2.4 1.2-3.2-6.4-4.1 3.6z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572" y="210" font-size="15" fill="#1f2328" font-weight="600">Deliver</text><text x="572" y="227" font-size="13" fill="#59636e">authorised input</text><path d="M683.5 198L692.5 198M689 194.5L692.5 198L689 201.5" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="694" y="158" width="122" height="80" rx="8" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(706 168) scale(0.92)"><path d="M2 12c2.6-4.4 6-6.5 10-6.5s7.4 2.1 10 6.5c-2.6 4.4-6 6.5-10 6.5S4.6 16.4 2 12z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="#0a6b62"/></g><text x="706" y="210" font-size="15" fill="#1f2328" font-weight="600">Verify</text><text x="706" y="227" font-size="13" fill="#59636e">visual change</text><path d="M24 248v6h524v-6" fill="none" stroke="#8a5300" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="264" width="73" height="22" rx="4" fill="#fff1cf" stroke="#dcb25a"/><text x="60.5" y="279.5" font-size="12" fill="#8a5300" font-weight="600" text-anchor="middle" class="m">rejected</text><text x="107" y="279.5" font-size="13" fill="#59636e">nothing delivered</text><path d="M576 240v22" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="264" width="122" height="22" rx="4" fill="#dcf3ee" stroke="#7fc8bc"/><text x="621" y="279.5" font-size="12" fill="#0a6b62" font-weight="600" text-anchor="middle" class="m">input_delivered</text><path d="M710 240v22" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="694" y="264" width="122" height="22" rx="4" fill="#dcf3ee" stroke="#7fc8bc"/><text x="755" y="279.5" font-size="12" fill="#0a6b62" font-weight="600" text-anchor="middle" class="m">effect_observed</text><g transform="translate(634.5 0)"><rect x="0" y="292" width="107" height="22" rx="4" fill="#fff1cf" stroke="#dcb25a"/><text x="53.5" y="307.5" font-size="12" fill="#8a5300" font-weight="600" text-anchor="middle" class="m">indeterminate</text></g></svg>
