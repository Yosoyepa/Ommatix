<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 364" width="840" height="364" role="img" aria-labelledby="title desc"><title id="title">Fail-closed action gate</title><desc id="desc">Every action first passes a reference check: snapshot, target, revision and age. A dry run, the default, then returns simulated and delivers nothing. Live input, off by default, must also pass the operator&#x27;s policy, the allowed foreground application, a fresh screen and a last look before one input is delivered and its effect verified. Any failed check is rejected and delivers nothing. A delivery reports input_delivered, effect_observed or indeterminate, which is never retried.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style><rect x="0.5" y="0.5" width="839" height="363" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="24" y="42" font-size="20" fill="#1f2328" font-weight="700">Fail closed: every action passes the gate</text><text x="24" y="65" font-size="14" fill="#59636e">A dry run is the default. Live input needs every check, every time.</text><rect x="24" y="105" width="129" height="26" rx="13" fill="#ece9fb" stroke="#b3a8ea"/><text x="88.5" y="122.55" font-size="13" fill="#5a45c4" font-weight="600" text-anchor="middle" class="m">execute_action</text><path d="M157 118L175 118M171 114L175 118L171 122" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="179" y="92" width="268" height="52" rx="8" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(191 106)"><path d="M3.5 4.5h8.2l8.8 8.8-7.2 7.2-9.8-9.8z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.6" fill="#0a6b62"/></g><text x="225" y="114" font-size="15" fill="#1f2328" font-weight="600">Reference</text><text x="225" y="132" font-size="13" fill="#59636e">snapshot · target · revision · age</text><path d="M451 118L577 118M573 114L577 118L573 122" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="513" y="110" font-size="13" fill="#0a6b62" font-weight="600" text-anchor="middle">dry run · default</text><rect x="583" y="107" width="85" height="22" rx="4" fill="#dcf3ee" stroke="#7fc8bc"/><text x="625.5" y="122.5" font-size="13" fill="#0a6b62" font-weight="600" text-anchor="middle" class="m">simulated</text><text x="678" y="122.5" font-size="13" fill="#59636e">nothing is delivered</text><path d="M203 146L203 172Q203 178 197 178L91 178Q85 178 85 184L85 189.5M81 185.5L85 189.5L89 185.5" fill="none" stroke="#8a5300" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="215" y="170" font-size="13" fill="#8a5300" font-weight="600">live input · dry_run: false · off by default</text><rect x="24" y="192" width="122" height="80" rx="8" fill="#ffffff" stroke="#d1d9e0"/><g transform="translate(36 202) scale(0.92)"><path d="M12 2.5l8 3v6.2c0 5-3.4 8.3-8 9.8-4.6-1.5-8-4.8-8-9.8V5.5z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.4 12.2l2.6 2.6 4.8-5.2" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="36" y="244" font-size="15" fill="#1f2328" font-weight="600">Policy</text><text x="36" y="261" font-size="13" fill="#59636e">operator allows</text><path d="M147.5 232L156.5 232M153 228.5L156.5 232L153 235.5" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="158" y="192" width="122" height="80" rx="8" fill="#ffffff" stroke="#d1d9e0"/><g transform="translate(170 202) scale(0.92)"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5"/><path d="M2.5 9h19" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="170" y="244" font-size="15" fill="#1f2328" font-weight="600">Foreground</text><text x="170" y="261" font-size="13" fill="#59636e">allowed app</text><path d="M281.5 232L290.5 232M287 228.5L290.5 232L287 235.5" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="292" y="192" width="122" height="80" rx="8" fill="#ffffff" stroke="#d1d9e0"/><g transform="translate(304 202) scale(0.92)"><circle cx="12" cy="12" r="9" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5"/><path d="M12 7v5.2l3.4 2" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="304" y="244" font-size="15" fill="#1f2328" font-weight="600">Freshness</text><text x="304" y="261" font-size="13" fill="#59636e">same screen</text><path d="M415.5 232L424.5 232M421 228.5L424.5 232L421 235.5" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="426" y="192" width="122" height="80" rx="8" fill="#ffffff" stroke="#d1d9e0"/><g transform="translate(438 202) scale(0.92)"><path d="M19.8 12a7.8 7.8 0 1 1-2.6-5.8M19.8 3.6v4.6h-4.6" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.2" fill="#0a6b62"/></g><text x="438" y="244" font-size="15" fill="#1f2328" font-weight="600">Last look</text><text x="438" y="261" font-size="13" fill="#59636e">checked again</text><path d="M549.5 232L558.5 232M555 228.5L558.5 232L555 235.5" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="192" width="122" height="80" rx="8" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(572 202) scale(0.92)"><path d="M6 3.5l12.5 8.2-5.4 1.1 3.3 6.4-2.4 1.2-3.2-6.4-4.1 3.6z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572" y="244" font-size="15" fill="#1f2328" font-weight="600">Deliver</text><text x="572" y="261" font-size="13" fill="#59636e">authorised input</text><path d="M683.5 232L692.5 232M689 228.5L692.5 232L689 235.5" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="694" y="192" width="122" height="80" rx="8" fill="#ffffff" stroke="#7fc8bc"/><g transform="translate(706 202) scale(0.92)"><path d="M2 12c2.6-4.4 6-6.5 10-6.5s7.4 2.1 10 6.5c-2.6 4.4-6 6.5-10 6.5S4.6 16.4 2 12z" fill="#dcf3ee" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="#0a6b62"/></g><text x="706" y="244" font-size="15" fill="#1f2328" font-weight="600">Verify</text><text x="706" y="261" font-size="13" fill="#59636e">report the effect</text><path d="M24 282v6h524v-6" fill="none" stroke="#8a5300" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="298" width="73" height="22" rx="4" fill="#fff1cf" stroke="#dcb25a"/><text x="60.5" y="313.5" font-size="12" fill="#8a5300" font-weight="600" text-anchor="middle" class="m">rejected</text><text x="107" y="313.5" font-size="13" fill="#59636e">any failed check, dry run included: nothing is delivered</text><text x="24" y="342" font-size="12" fill="#8a5300" class="m">POLICY_DENIED · STALE_SNAPSHOT · STALE_TARGET</text><path d="M560 282v6h256v-6" fill="none" stroke="#0a6b62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="298" width="124" height="22" rx="4" fill="#dcf3ee" stroke="#7fc8bc"/><text x="622" y="313.5" font-size="12" fill="#0a6b62" font-weight="600" text-anchor="middle" class="m">input_delivered</text><rect x="690" y="298" width="124" height="22" rx="4" fill="#dcf3ee" stroke="#7fc8bc"/><text x="752" y="313.5" font-size="12" fill="#0a6b62" font-weight="600" text-anchor="middle" class="m">effect_observed</text><rect x="560" y="327" width="109" height="22" rx="4" fill="#fff1cf" stroke="#dcb25a"/><text x="614.5" y="342.5" font-size="12" fill="#8a5300" font-weight="600" text-anchor="middle" class="m">indeterminate</text><text x="678" y="342" font-size="13" fill="#59636e">never retried</text></svg>
