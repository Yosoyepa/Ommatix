<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 708" width="360" height="708" role="img" aria-labelledby="title desc"><title id="title">Ommatix observation and action pipeline</title><desc id="desc">Eleven numbered stages. The engine captures a frame, plans the changed regions, runs the detector and OCR on them, fuses the evidence, resolves icons, tracks identity and publishes an atomic snapshot. The LLM agent, drawn in its own colour, reasons over MCP. The engine then gates the action, delivers authorised input and verifies the effect; a loop mark after the last stage leads back to a new observation.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style><rect x="0.5" y="0.5" width="359" height="707" rx="10" fill="#151b23" stroke="#3d444d"/><text x="20" y="38" font-size="19" fill="#f0f6fc" font-weight="700">From a frame to an</text><text x="20" y="62" font-size="19" fill="#f0f6fc" font-weight="700">accountable action</text><text x="20" y="84" font-size="13" fill="#9198a1">Perception stays local.</text><text x="20" y="101" font-size="13" fill="#9198a1">Reasoning stays with the agent.</text><path d="M38 138V672" fill="none" stroke="#3d444d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="38" cy="138" r="17" fill="#0d1117" stroke="#1f7a70"/><g transform="translate(26 126)"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5"/><path d="M2.5 9h19" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="135" font-size="13" fill="#4fd1bd" font-weight="700" class="m">01</text><text x="92" y="135" font-size="15" fill="#f0f6fc" font-weight="600">Capture</text><text x="68" y="153" font-size="13" fill="#9198a1">frame + dirty rectangles</text><circle cx="38" cy="188" r="17" fill="#0d1117" stroke="#1f7a70"/><g transform="translate(26 176)"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="#4fd1bd" stroke-width="1.5"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18" fill="none" stroke="#4fd1bd" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="9" y="9" width="6" height="6" fill="#4fd1bd"/><rect x="15" y="9" width="6" height="6" fill="#4fd1bd"/></g><text x="68" y="185" font-size="13" fill="#4fd1bd" font-weight="700" class="m">02</text><text x="92" y="185" font-size="15" fill="#f0f6fc" font-weight="600">Region plan</text><text x="68" y="203" font-size="13" fill="#9198a1">committed base + halo</text><circle cx="38" cy="238" r="17" fill="#0d1117" stroke="#1f7a70"/><g transform="translate(26 226)"><rect x="2.5" y="5.5" width="19" height="13" rx="2" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-dasharray="3 2.5"/><path d="M7 15l2.5-6 2.5 6M8 13.2h3M14.5 12.3a1.8 1.8 0 1 0 0 2.4M16.3 10.6v4.4" fill="none" stroke="#4fd1bd" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="235" font-size="13" fill="#4fd1bd" font-weight="700" class="m">03</text><text x="92" y="235" font-size="15" fill="#f0f6fc" font-weight="600">Detector + OCR</text><text x="68" y="253" font-size="13" fill="#9198a1">planned regions only</text><circle cx="38" cy="288" r="17" fill="#0d1117" stroke="#1f7a70"/><g transform="translate(26 276)"><rect x="3" y="4" width="12" height="11" rx="2" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5"/><rect x="9" y="9" width="12" height="11" rx="2" fill="none" stroke="#4fd1bd" stroke-width="1.5"/></g><text x="68" y="285" font-size="13" fill="#4fd1bd" font-weight="700" class="m">04</text><text x="92" y="285" font-size="15" fill="#f0f6fc" font-weight="600">Spatial fusion</text><text x="68" y="303" font-size="13" fill="#9198a1">visual + optional UIA</text><circle cx="38" cy="338" r="17" fill="#0d1117" stroke="#1f7a70"/><g transform="translate(26 326)"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" fill="none" stroke="#4fd1bd" stroke-width="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5" fill="none" stroke="#4fd1bd" stroke-width="1.5"/><path d="M15.2 15.6a2.2 2.2 0 1 1 3 2.1c-.7.4-.9.8-.9 1.4M17.3 21v.1" fill="none" stroke="#4fd1bd" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="335" font-size="13" fill="#4fd1bd" font-weight="700" class="m">05</text><text x="92" y="335" font-size="15" fill="#f0f6fc" font-weight="600">Icon cache</text><text x="68" y="353" font-size="13" fill="#9198a1">curated; may abstain</text><circle cx="38" cy="388" r="17" fill="#0d1117" stroke="#1f7a70"/><g transform="translate(26 376)"><path d="M3.5 4.5h8.2l8.8 8.8-7.2 7.2-9.8-9.8z" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.6" fill="#4fd1bd"/></g><text x="68" y="385" font-size="13" fill="#4fd1bd" font-weight="700" class="m">06</text><text x="92" y="385" font-size="15" fill="#f0f6fc" font-weight="600">Identity</text><text x="68" y="403" font-size="13" fill="#9198a1">session IDs + revisions</text><circle cx="38" cy="438" r="17" fill="#0d1117" stroke="#1f7a70"/><g transform="translate(26 426)"><path d="M12 3.5l9 4.5-9 4.5-9-4.5z" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12.5l9 4.5 9-4.5M3 16.5l9 4.5 9-4.5" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="435" font-size="13" fill="#4fd1bd" font-weight="700" class="m">07</text><text x="92" y="435" font-size="15" fill="#f0f6fc" font-weight="600">Atomic snapshot</text><text x="68" y="453" font-size="13" fill="#9198a1">publish together</text><circle cx="38" cy="488" r="17" fill="#0d1117" stroke="#5a4fa8"/><g transform="translate(26 476)"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9-1.9 5.6-1.9-5.6-5.6-1.9 5.6-1.9z" fill="#231f45" stroke="#b3a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 16.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="#b3a6ff" stroke="#b3a6ff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="485" font-size="13" fill="#b3a6ff" font-weight="700" class="m">08</text><text x="92" y="485" font-size="15" fill="#f0f6fc" font-weight="600">LLM agent</text><text x="68" y="503" font-size="13" fill="#9198a1">reasoning via MCP</text><circle cx="38" cy="538" r="17" fill="#0d1117" stroke="#1f7a70"/><g transform="translate(26 526)"><path d="M12 2.5l8 3v6.2c0 5-3.4 8.3-8 9.8-4.6-1.5-8-4.8-8-9.8V5.5z" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.4 12.2l2.6 2.6 4.8-5.2" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="535" font-size="13" fill="#4fd1bd" font-weight="700" class="m">09</text><text x="92" y="535" font-size="15" fill="#f0f6fc" font-weight="600">Action gate</text><text x="68" y="553" font-size="13" fill="#9198a1">policy + freshness</text><circle cx="38" cy="588" r="17" fill="#0d1117" stroke="#1f7a70"/><g transform="translate(26 576)"><path d="M6 3.5l12.5 8.2-5.4 1.1 3.3 6.4-2.4 1.2-3.2-6.4-4.1 3.6z" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="585" font-size="13" fill="#4fd1bd" font-weight="700" class="m">10</text><text x="92" y="585" font-size="15" fill="#f0f6fc" font-weight="600">OS actuator</text><text x="68" y="603" font-size="13" fill="#9198a1">authorised input</text><circle cx="38" cy="638" r="17" fill="#0d1117" stroke="#1f7a70"/><g transform="translate(26 626)"><path d="M2 12c2.6-4.4 6-6.5 10-6.5s7.4 2.1 10 6.5c-2.6 4.4-6 6.5-10 6.5S4.6 16.4 2 12z" fill="#0f2e2c" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="#4fd1bd"/></g><text x="68" y="635" font-size="13" fill="#4fd1bd" font-weight="700" class="m">11</text><text x="92" y="635" font-size="15" fill="#f0f6fc" font-weight="600">Effect verifier</text><text x="68" y="653" font-size="13" fill="#9198a1">report uncertainty</text><circle cx="38" cy="682" r="12" fill="#151b23"/><g transform="translate(28 672) scale(0.83)"><path d="M19.8 12a7.8 7.8 0 1 1-2.6-5.8M19.8 3.6v4.6h-4.6" fill="none" stroke="#4fd1bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.2" fill="#4fd1bd"/></g></svg>
