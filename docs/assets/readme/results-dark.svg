<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="488" aria-labelledby="title desc" role="img" viewBox="0 0 1200 488"><title id="title">Preliminary AG-02 scores, not a model ranking</title><desc id="desc">Phase 1: Haiku 10 of 11, DeepSeek 11 of 11, MiMo 10 of 11. Phase 2: 6, 7 and 7 of 11. Scores include abstentions. Phase 1 exempts the decoy verdict. One series per model and phase; no VLM baseline.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}</style><rect width="1200" height="488" fill="#0d1b2a" stroke="#3c5369" rx="24"/><text x="32" y="48" fill="#f0f6fc" font-size="22" font-weight="700">AG-02 / PRELIMINARY</text><text x="32" y="80" fill="#adbdce" font-size="21">Scores out of 11 goals, including correct abstentions</text><rect width="16" height="16" x="32" y="104" fill="#adbdce" rx="3"/><text x="56" y="120" fill="#adbdce" font-size="18">Phase 1 · dry run</text><rect width="16" height="16" x="352" y="104" fill="#68e1ce" rx="3"/><text x="376" y="120" fill="#adbdce" font-size="18">Phase 2 · live</text><text x="32" y="194" fill="#f0f6fc" font-size="26" font-weight="600">Claude Haiku 5.5</text><rect width="592" height="16" x="440" y="168" fill="#142b3f" stroke="#3c5369" rx="5"/><rect width="538.182" height="16" x="440" y="168" fill="#adbdce" rx="5"/><text x="1048" y="182" fill="#f0f6fc" font-size="18" font-weight="650">10/11</text><rect width="592" height="16" x="440" y="196" fill="#142b3f" stroke="#3c5369" rx="5"/><rect width="322.909" height="16" x="440" y="196" fill="#68e1ce" rx="5"/><text x="1048" y="210" fill="#f0f6fc" font-size="18" font-weight="650">6/11</text><text x="32" y="266" fill="#f0f6fc" font-size="26" font-weight="600">DeepSeek V4.1 Flash*</text><rect width="592" height="16" x="440" y="240" fill="#142b3f" stroke="#3c5369" rx="5"/><rect width="592" height="16" x="440" y="240" fill="#adbdce" rx="5"/><text x="1048" y="254" fill="#f0f6fc" font-size="18" font-weight="650">11/11</text><rect width="592" height="16" x="440" y="268" fill="#142b3f" stroke="#3c5369" rx="5"/><rect width="376.727" height="16" x="440" y="268" fill="#68e1ce" rx="5"/><text x="1048" y="282" fill="#f0f6fc" font-size="18" font-weight="650">7/11</text><text x="32" y="338" fill="#f0f6fc" font-size="26" font-weight="600">MiMo V2.6 Flash</text><rect width="592" height="16" x="440" y="312" fill="#142b3f" stroke="#3c5369" rx="5"/><rect width="538.182" height="16" x="440" y="312" fill="#adbdce" rx="5"/><text x="1048" y="326" fill="#f0f6fc" font-size="18" font-weight="650">10/11</text><rect width="592" height="16" x="440" y="340" fill="#142b3f" stroke="#3c5369" rx="5"/><rect width="376.727" height="16" x="440" y="340" fill="#68e1ce" rx="5"/><text x="1048" y="354" fill="#f0f6fc" font-size="18" font-weight="650">7/11</text><text x="32" y="416" fill="#adbdce" font-size="20">One series per model and phase · two synthetic apps · one machine</text><text x="32" y="444" fill="#adbdce" font-size="19">Phase 1 scores choices; its decoy-goal verdict is exempt.</text><text x="32" y="470" fill="#adbdce" font-size="17">* Version attributed to provider documentation; the run records an alias.</text></svg>
