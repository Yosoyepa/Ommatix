# Plantilla de diseño, no configura un binario incluido en este paquete.
[engine]
mode = "dry_run"
platform = "windows"
snapshot_policy = "strict"
tile_size = 64
halo_px = 32
max_regions = 4
full_refresh_area_ratio = 0.40
# Regla de coste adaptativa del Algoritmo 1 (INC-07, ADR-0030): un plan con esta cantidad de
# regiones o mas se procesa como refresco completo (razon adaptive_cost), porque cada region es
# una inferencia completa del detector y el fotograma entero es una. 0 apaga la regla.
adaptive_min_regions = 2
# Vigencia (ADR-0025, INC-03): edad máxima, medida en el reloj inyectado, de la captura del
# snapshot y de la lectura de accesibilidad que confirma un objetivo, para autorizar una
# acción. Se comprueba en la puerta, también en simulación, y antes de cada entrada real. Pasado
# el plazo: STALE_SNAPSHOT, observar de nuevo. Por defecto 10 000 ms, más que los 250 ms del
# primer borrador: un agente actúa segundos después de observar y la captura de frescura sigue
# protegiendo la pantalla.
max_snapshot_age_ms = 10000
# Plazo de verificación del efecto (SDD §2.9, BDD-29): tras entregar, el motor vuelve a
# capturar cada verify_poll_ms hasta ver un cambio visual o hasta que venza el plazo
# (entonces indeterminate, sin reintentar). 0: una sola comprobación inmediata.
verify_timeout_ms = 500
verify_poll_ms = 50

[mcp]
profile = "2026-07-28"
transport = "stdio"
legacy_enabled = false
max_message_bytes = 65536

[safety]
actuation_enabled = false
allowed_applications = []
allow_destructive = false
allow_screenshots_to_client = false
include_values = false
# Parada local del operador (§8.2): mientras exista este archivo no se envía entrada nueva.
# Vacío: sin archivo de parada; la parada local es terminar el proceso.
stop_file = ""
# Alcance por ventana (ADR-0020, aprobada): por aplicación permitida, las únicas clases de
# ventana que reciben entrada real. Vacío: ninguna aplicación se restringe por clase. Ejemplo
# para el explorador, que también es dueño del escritorio y de la barra de tareas:
# allowed_window_classes = { "explorer.exe" = ["CabinetWClass"] }
allowed_window_classes = {}
# Ventana registrada por el operador (ADR-0020): ruta de un archivo que contiene el
# identificador (decimal) de la única ventana que puede recibir entrada real. Se lee en cada
# acción; si falta, está vacío o no es un identificador, no se permite ninguna entrada.
# Vacío: sin ventana registrada.
window_pin_file = ""
# Borrado bajo demanda del operador (SEC-07, capítulo 08 §8.4; ADR-0028, propuesta): mientras el
# operador cree este archivo, el motor borra su estado y su caché en su siguiente petición, una
# vez por cada archivo nuevo. El motor nunca borra el archivo. Vacío: sin archivo de purga.
purge_file = ""

[models]
# El runtime futuro debe fallar de forma segura mientras no se configure S0.
detector_path = ""
detector_sha256 = ""
ocr_path = ""
ocr_sha256 = ""
# Evidencia de accesibilidad (ADR-0017): "none" (por defecto) o "uia" (árbol de UI Automation
# de la aplicación en primer plano, sólo Windows, sólo con --source dxgi o screen). Se fusiona
# con la visión y nunca la sustituye; nunca se lee el valor de un campo. Con "uia", `type`
# envía sus teclas sólo cuando el foco de teclado está en el elemento objetivo (ADR-0018);
# con "none" conserva la comprobación de foco a nivel de ventana del actuador.
accessibility = "none"

[cache]
max_entries = 4096
persist = false
