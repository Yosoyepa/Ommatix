name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Acceptance specification (Gherkin)
        run: cargo test -p ommatix-acceptance
      - name: Smoke test (demo pipeline)
        run: cargo run --quiet -- demo

  screen-feature:
    name: screen capture + native input features build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install capture system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libpipewire-0.3-dev libgbm-dev \
            libegl1-mesa-dev libxcb1-dev libxrandr-dev libdbus-1-dev clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p ommatix --features screen,native-input --all-targets -- -D warnings
