[package]
name = "ommatix"
description = "Ommatix: Spatial Indexing and Incremental Perception for GUI Agents. Composition root and CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ommatix"
path = "src/main.rs"

[features]
default = []
## Enable live screen capture (`--source screen`).
screen = ["ommatix-adapter-capture/screen"]
## Enable real mouse/keyboard input (`--input native`). Native input only aims at the
## captured screen, so it implies `screen`.
native-input = ["screen", "ommatix-adapter-input/native"]
## Enable DXGI Desktop Duplication capture (`--source dxgi`, Windows only).
dxgi = ["ommatix-adapter-capture/dxgi"]
## Enable Win32 SendInput (`--input sendinput`, Windows only). It only aims at the DXGI
## capture, so it implies `dxgi`.
sendinput = ["dxgi", "ommatix-adapter-input/sendinput"]
## Enable the ONNX detector (`[models] detector_manifest`). ONNX Runtime is loaded at run
## time from the library `[models] onnxruntime_path` pins; nothing is downloaded at build.
onnx = ["ommatix-adapter-vision/onnx"]
## Enable the DirectML execution provider for the ONNX detector
## (`[models] detector_execution_provider = "directml"`). Windows only; implies `onnx`.
directml = ["onnx", "ommatix-adapter-vision/directml"]
## Enable Windows OCR (`[models] ocr = "winrt"`). Windows only.
winrt-ocr = ["ommatix-adapter-vision/winrt-ocr"]

[dependencies]
ommatix-adapter-capture = { workspace = true }
ommatix-adapter-input = { workspace = true }
ommatix-adapter-mcp = { workspace = true }
ommatix-adapter-sim = { workspace = true }
ommatix-adapter-vision = { workspace = true }
ommatix-application = { workspace = true }
ommatix-domain = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
toml = { workspace = true }

[lints]
workspace = true
