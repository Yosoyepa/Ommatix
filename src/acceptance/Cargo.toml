[package]
name = "ommatix-acceptance"
description = "Executable Gherkin specification of the Ommatix MVP: the thesis scenarios, driven through the MCP adapter like a real agent where they talk about one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
ommatix = { workspace = true }
ommatix-adapter-mcp = { workspace = true }
ommatix-adapter-sim = { workspace = true }
ommatix-application = { workspace = true }
ommatix-domain = { workspace = true }
cucumber = { workspace = true }
futures = { workspace = true }
jsonschema = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[[test]]
name = "thesis"
harness = false

[[example]]
## PERF-01 (RNF-04): the latency of the core on 300 controls and 600 text spans. Its unit
## tests run with `cargo test`; the measurement needs `--release`.
name = "core_latency"
test = true

[[example]]
## ADR-0027 (INC-05): the candidate enumeration of Algorithm 2, the scan against the R*-tree,
## on generated scenes of the protocol's families. Its unit tests run with `cargo test`; the
## measurement needs `--release`.
name = "candidate_index"
test = true

[lints]
workspace = true
