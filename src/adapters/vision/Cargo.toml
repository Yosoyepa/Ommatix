[package]
name = "ommatix-adapter-vision"
description = "Ommatix driven adapters: the flat-region and ONNX VisionDetectors, the null and Windows OCR TextRecognizers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
## The fail-closed ONNX detector (`OnnxVisionDetector`). ONNX Runtime is loaded at run
## time from a library the operator pins; nothing is downloaded at build time.
onnx = ["dep:ort"]
## The DirectML execution provider for the ONNX detector (Windows, DirectX 12). It needs an
## ONNX Runtime build with DirectML and the operator's pinned `DirectML.dll`, both loaded
## at run time.
directml = ["onnx", "ort/directml"]
## Windows OCR (`WinRtTextRecognizer`, `Windows.Media.Ocr`). No effect on other platforms.
winrt-ocr = ["dep:windows"]

[dependencies]
ommatix-application = { workspace = true }
ommatix-domain = { workspace = true }
ort = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

[[example]]
## S0 measurement probe (docs/thesis/S0_RESULTADOS.md): detector timings and candidates on
## synthetic frames, per execution provider.
name = "s0_probe"
required-features = ["onnx"]

[[example]]
## RNF-05 measurement (docs/thesis/S0_RESULTADOS.md §10): detections of each region in the
## smallest input that holds it, against the same region padded to the largest input.
name = "s0_shapes"
required-features = ["onnx"]

[lints]
workspace = true
