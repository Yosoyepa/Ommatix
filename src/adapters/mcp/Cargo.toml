[package]
name = "ommatix-adapter-mcp"
description = "Ommatix driving adapter: the Ommatix 1.0 tool contract over the Model Context Protocol (stdio; profile 2026-07-28, opt-in 2025-11-25)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
## Serve broker connections over a Windows named pipe, and open that pipe as a client
## (ADR-0043, proposed). Windows only: no effect on other platforms. Nothing in the
## executable uses it yet.
broker-pipe = ["dep:interprocess", "dep:widestring"]

[dependencies]
ommatix-application = { workspace = true }
ommatix-domain = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util"] }

[target.'cfg(windows)'.dependencies]
interprocess = { workspace = true, optional = true }
widestring = { workspace = true, optional = true }

[dev-dependencies]
jsonschema = { workspace = true }
ommatix-adapter-sim = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt"] }

[lints]
workspace = true
