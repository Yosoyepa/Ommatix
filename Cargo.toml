[workspace]
resolver = "3"
members = [
    "src/domain",
    "src/application",
    "src/adapters/capture",
    "src/adapters/vision",
    "src/adapters/input",
    "src/adapters/mcp",
    "src/adapters/sim",
    "src/app",
    "src/acceptance",
]
default-members = ["src/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
repository = "https://github.com/Yosoyepa/Ommatix"
publish = false

[workspace.dependencies]
ommatix-domain = { path = "src/domain" }
ommatix-application = { path = "src/application" }
ommatix-adapter-capture = { path = "src/adapters/capture" }
ommatix-adapter-vision = { path = "src/adapters/vision" }
ommatix-adapter-input = { path = "src/adapters/input" }
ommatix-adapter-mcp = { path = "src/adapters/mcp" }
ommatix-adapter-sim = { path = "src/adapters/sim" }

anyhow = "1"
enigo = "0.6"
cucumber = "0.23"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
jsonschema = { version = "0.58", default-features = false }
# `load-dynamic`: nothing is downloaded or linked at build time; the operator pins the
# ONNX Runtime library by SHA-256. rc.13 keeps the workspace MSRV (rc.14 needs 1.92).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
rmcp = { version = "3.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", default-features = false }
toml = "1"
unicode-normalization = "0.1"
xcap = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
# stdout carries the MCP protocol: nothing else may print there (`demo` opts out).
print_stdout = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
