# S0 spike: the OmniParser icon_detect_v3 detector on DirectML (DirectX 12 GPU) and Windows
# OCR (es-ES). See docs/thesis/S0_RESULTADOS.md; ommatix.s0.toml is the CPU baseline.
#
# Copy this file to %LOCALAPPDATA%\Ommatix\ommatix.s0.directml.toml. Relative paths resolve
# against the configuration file, so that directory must hold, besides the model files of
# ommatix.s0.toml:
#   runtime\onnxruntime-directml-1.24.4\onnxruntime.dll   (NuGet Microsoft.ML.OnnxRuntime.DirectML 1.24.4,
#                                                         runtimes/win-x64/native/onnxruntime.dll)
#   runtime\onnxruntime-directml-1.24.4\DirectML.dll      (NuGet Microsoft.AI.DirectML 1.15.4,
#                                                         bin/x64-win/DirectML.dll)
# Microsoft publishes no DirectML build of ONNX Runtime 1.28: 1.24.4 is the latest one, and
# `ort` 2.0.0-rc.13 accepts any ONNX Runtime from 1.17. DirectML.dll is loaded from here by
# absolute path before ONNX Runtime, never the copy in System32. If DirectML cannot be
# created, or any node would run on the CPU, the detector is refused: there is no fallback.
# Run it from this repository's root:
#   cargo run --release -p ommatix --features dxgi,directml,winrt-ocr -- demo --source dxgi ^
#     --config %LOCALAPPDATA%\Ommatix\ommatix.s0.directml.toml --session-id s0 --observations 20 --timings
# Input stays dry run: [safety] keeps the template's deny-everything defaults.

[engine]
mode = "dry_run"

[safety]
actuation_enabled = false
allowed_applications = []

[models]
detector_manifest = "models/manifest.json"
detector_manifest_sha256 = "63d9df24109308d1e2b354648139fee0c1d4e2563f8cb2a83497d4e26b7d728e"
onnxruntime_path = "runtime/onnxruntime-directml-1.24.4/onnxruntime.dll"
onnxruntime_sha256 = "e7eedec6a6f26dc39dc948276a75ef6d2bee3fff944d874ceed0bbd3b97bff40"
detector_execution_provider = "directml"
directml_path = "runtime/onnxruntime-directml-1.24.4/DirectML.dll"
directml_sha256 = "9c9e6d822561c6c41b90e6994b3e8857cf1d66dbfb1e0c4c799c7c89b4e92da1"
detector_threads = 0
ocr = "winrt"
ocr_language = "es-ES"
