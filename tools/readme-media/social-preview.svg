<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc"><title id="title">Ommatix social preview</title><desc id="desc">Research prototype for incremental desktop perception and identifier-based MCP control.</desc><style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif}</style><rect x="0" y="0" width="1280" height="640" rx="16" fill="#0d1b2a" stroke="none" /><text x="64" y="72" font-size="20" fill="#68e1ce" letter-spacing="3" font-weight="650">RUST / MCP / RESEARCH PROTOTYPE</text><text x="64" y="208" font-size="104" fill="#f0f6fc" font-weight="750">Ommatix</text><text x="64" y="296" font-size="52" fill="#f0f6fc" font-weight="650">A stable interface</text><text x="64" y="360" font-size="52" fill="#f0f6fc" font-weight="650">to a changing desktop.</text><text x="64" y="472" font-size="28" fill="#adbdce" >Spatial Indexing and Incremental Perception</text><text x="64" y="516" font-size="28" fill="#adbdce" >for GUI Agents</text><rect x="904" y="160" width="312" height="312" rx="24" fill="#142b3f" stroke="#3c5369" /><text x="936" y="240" font-size="72" fill="#f0f6fc" font-weight="700">e7</text><text x="936" y="304" font-size="28" fill="#68e1ce" >revision 3</text><text x="936" y="408" font-size="24" fill="#adbdce" >Observe → act</text><text x="64" y="596" font-size="24" fill="#68e1ce" >Element IDs · incremental perception · fail-closed actuation</text></svg>